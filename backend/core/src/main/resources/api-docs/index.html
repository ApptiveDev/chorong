<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chorong API</title>
</head>
<body>
  <div id="app"></div>
  <!-- v1 명세는 같은 디렉터리의 openapi.yaml 이다. 서버 생성은 springdoc 의 /api-docs 이며 구 /api 경로를 포함한다. -->
  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
  <script>
    Scalar.createApiReference('#app', {
      sources: [
        { slug: 'v1', title: 'v1 목표 명세 (0.3.0, 구현 중)', url: '/docs/openapi.yaml' },
        { slug: 'server', title: '서버 생성 (전체)', url: '/api-docs' },
      ],
      hideClientButton: true,
      persistAuth: true,
    })
  </script>
</body>
</html>
