spring:
  application:
    name: bawibase-chorong
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:appdb}?currentSchema=${DB_SCHEMA:chorong_dev}
    username: ${POSTGRES_USER:dev}
    password: ${POSTGRES_PASSWORD:dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:chorong_dev}
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:chorong_dev}
    default-schema: ${DB_SCHEMA:chorong_dev}
    create-schemas: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    enabled: false

server:
  port: 8080
  forward-headers-strategy: framework

app:
  cors:
    origins: ${CORS_ORIGINS:http://localhost:8081,http://localhost:19006}
  jwt:
    # HS256 비밀키. 32바이트 이상. 운영은 JWT_SECRET 환경변수로 주입한다.
    secret: ${JWT_SECRET:chorong-dev-only-secret-change-me-0123456789abcdef}
    access-ttl: ${JWT_ACCESS_TTL:PT30M}
    refresh-ttl: ${JWT_REFRESH_TTL:P365D}
