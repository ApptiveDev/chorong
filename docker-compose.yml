services:
  postgres:
    image: postgres:16-alpine
    container_name: bawibase-chorong-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - bawibase_chorong_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d appdb"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 백엔드까지 컨테이너로 띄운다: `docker compose --profile stack up`
  core:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bawibase-chorong-core
    profiles: ["stack"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: appdb
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      DB_SCHEMA: chorong_dev
      CORS_ORIGINS: "http://localhost:8081,http://localhost:19006"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  bawibase_chorong_pg_data:
