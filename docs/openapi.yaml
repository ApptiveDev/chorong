openapi: 3.1.0
info:
  title: 초롱 서비스 API
  version: 0.4.3
  description: |
    피그마 개발자 전달용 페이지와 디자인 파일, 학습 콘텐츠 시뮬레이터, 학습 콘텐츠 회의 결정을 반영한 API 계약입니다.
    기준 자료가 충돌하면 학습 유형과 퀴즈 콘텐츠는 시뮬레이터와 추가 유형 피그마를, 화면 동작은 개발자 전달용 페이지와 디자인을 따릅니다.
    0.4.3의 주요 변경 (2026-11-20 기획 변경):
    - 닉네임 중복을 허용합니다. ERR-16 NICKNAME_TAKEN을 삭제했습니다.
    - 회원이 될 때 기본 닉네임을 넣지 않습니다. 닉네임을 저장하기 전까지 회원의 닉네임은 비어 있습니다.
    - `Me`·`UserBrief`에 `nicknameRequired`를 추가했습니다. true면 앱은 닉네임 설정 모달을 띄우고, 저장해야 닫습니다.
      소셜 가입·게스트 전환 직후, 그리고 닉네임을 저장하지 않은 회원의 로그인 직후가 해당합니다.
    - 기본 닉네임(`No. ` + 숫자 8자리)을 그대로 쓰던 기존 회원도 닉네임을 비워서 다음 로그인 때 모달을 띄웁니다.
servers:
  - url: https://api-chorong.bawibase.com/api/v1
    description: production
  - url: https://api-chorong-dev.bawibase.com/api/v1
    description: development

tags:
  - name: auth
    description: F-01 인증 (API-1xx)
  - name: users
    description: F-02 회원 정보 (API-2xx)
  - name: push
    description: F-03 알림 (API-3xx). 2일 이상 연속 학습 후 전날 학습하지 않은 사용자에게 10:00·18:00 KST에 발송합니다.
  - name: learning
    description: F-04 퀴즈와 학습 (API-4xx)
  - name: review
    description: F-05 복습하기 (API-5xx)
  - name: onboarding
    description: F-06 온보딩 (API-6xx)
  - name: housing
    description: F-07 하우징 · F-08 아바타 (API-7xx)
  - name: community
    description: F-09 커뮤니티 (API-8xx)
  - name: shop
    description: F-10 상점 · F-11 보상 · F-12 재화 · F-13 별자리 · F-14 인벤토리 (API-9xx)

security:
  - guest: []

paths:
  # ---------------------------------------------------------------- API-1xx 인증
  /auth/guest:
    post:
      tags: [auth]
      operationId: API-101
      summary: 게스트 계정 생성 또는 디바이스 자동 로그인
      description: |
        F-01-01, F-02-05, F-07-01. 같은 `deviceUuid`가 이미 있으면 기존 게스트 계정을 돌려주고,
        없으면 users · user_auth · auth_guest · 하우징 · 아바타 · 지갑을 함께 생성합니다.
        신규 사용자에게 기본 가구(책상·의자)와 고양이를 지급합니다. 고양이는 인벤토리에 나오지 않습니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceUuid, platform]
              properties:
                deviceUuid: { type: string, format: uuid }
                platform: { $ref: '#/components/schemas/Platform' }
      responses:
        '200':
          description: 토큰 쌍과 유저
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400': { $ref: '#/components/responses/ValidationFailed' }

  /auth/email/signup:
    post:
      tags: [auth]
      operationId: API-102
      summary: 이메일 회원가입 – 인증코드 발송
      description: F-01-02. 6자리 코드, 10분 유효, 재발송 60초 제한(ERR-08). 이미 가입된 이메일은 ERR-10.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password:
                  type: string
                  minLength: 8
                  maxLength: 64
                  description: 영문·숫자 포함
      responses:
        '200':
          description: 인증 세션
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      verificationId: { type: string }
                      expiresAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '409':
          description: ERR-10 EMAIL_ALREADY_REGISTERED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/email/verify:
    post:
      tags: [auth]
      operationId: API-103
      summary: 이메일 인증코드 확인 (가입 완료)
      description: |
        F-01-02, F-02-03. 게스트 토큰으로 호출하면 현재 게스트 계정에 이메일 수단을 붙이고
        status를 ACTIVE로 바꿉니다(가입하고 내 정보 저장하기). 해당 이메일이 이미 다른 회원 계정에
        있으면 ERR-14. 코드 불일치·만료는 ERR-15.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verificationId, code]
              properties:
                verificationId: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: 토큰 쌍과 유저
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          description: ERR-15 VERIFICATION_INVALID / ERR-05
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: ERR-14 ACCOUNT_EXISTS_FOR_PROVIDER
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/email/login:
    post:
      tags: [auth]
      operationId: API-104
      summary: 이메일 로그인
      description: F-01-03. 연속 5회 실패 시 15분 잠금(ERR-12, `retryAfter`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, deviceUuid]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                deviceUuid: { type: string, format: uuid }
      responses:
        '200':
          description: 토큰 쌍과 유저
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423':
          description: ERR-12 ACCOUNT_LOCKED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/oauth/{provider}:
    post:
      tags: [auth]
      operationId: API-105
      summary: OAuth 가입/로그인 (구글·카카오·애플)
      description: |
        F-01-04, F-02-03. `(provider, providerUid)` 일치 계정이 있으면 로그인, 없으면 신규 가입.
        게스트 토큰으로 호출하면 기록 저장(전환 가입)으로 처리하고, 게스트의 학습·보상 기록을 새 회원 계정으로 이어받습니다.
        신규 가입·전환 가입한 회원은 닉네임이 비어 있으며 `user.nicknameRequired`가 true입니다.
        게스트 토큰으로 호출했는데 해당 수단이 이미 다른 회원 계정에 있으면 ERR-14를 돌려줍니다.
        앱은 기존 계정 확인을 띄우고, 사용자가 기존 계정으로 로그인하기를 고르면 `switchToExisting=true`로 다시 호출합니다.
        이때는 기존 회원 계정으로 로그인하며 게스트 기록은 합치지 않습니다.
        인증만 성공하고 기록 승계가 실패하면 성공 응답을 돌려주지 않습니다.
      security:
        - {}
        - guest: []
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceUuid]
              properties:
                idToken:
                  type: string
                  description: google · apple ID 토큰
                accessToken:
                  type: string
                  description: kakao access token
                authorizationCode:
                  type: string
                  description: apple authorization code
                deviceUuid: { type: string, format: uuid }
                switchToExisting:
                  type: boolean
                  default: false
                  description: 게스트 토큰으로 호출할 때만 사용. true면 기존 회원 계정으로 로그인하고 게스트 기록은 합치지 않습니다.
      responses:
        '200':
          description: 토큰 쌍과 유저
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: ERR-14 ACCOUNT_EXISTS_FOR_PROVIDER. 게스트 기록 저장 중 기존 회원 계정을 발견함
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/token/refresh:
    post:
      tags: [auth]
      operationId: API-106
      summary: 토큰 갱신 (refresh 회전)
      description: F-01-05. 이미 revoke된 refresh 재사용은 ERR-04이며 해당 유저의 모든 토큰이 revoke됩니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken, deviceUuid]
              properties:
                refreshToken: { type: string }
                deviceUuid: { type: string, format: uuid }
      responses:
        '200':
          description: 새 토큰 쌍
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TokenPair' }
        '401':
          description: ERR-01 / ERR-04 AUTH_TOKEN_REUSED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: API-107
      summary: 로그아웃
      description: F-01-06. 현재 디바이스의 refresh 토큰 revoke, `all=true`면 전체 디바이스. Push 토큰도 삭제.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                all: { type: boolean, default: false }
      responses:
        '204': { description: 완료 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/link/{provider}:
    post:
      tags: [auth]
      operationId: API-108
      summary: 로그인 수단 연동
      description: |
        F-01-07. 해당 수단이 다른 계정에 이미 연결되어 있으면 존재 여부만 알리고 중단(ERR-11, 상대 계정 정보 없음).
        요청 본문은 provider별 자격 증명(API-102~105와 동일). `email` provider는 인증코드 확인까지 끝낸 `verificationId`를 보냅니다.
      security:
        - member: []
      parameters:
        - $ref: '#/components/parameters/LinkProvider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idToken: { type: string }
                accessToken: { type: string }
                authorizationCode: { type: string }
                verificationId: { type: string }
      responses:
        '200':
          description: 연동된 수단 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      providers:
                        type: array
                        items: { $ref: '#/components/schemas/AuthProvider' }
        '403': { $ref: '#/components/responses/MemberOnly' }
        '409':
          description: ERR-11 PROVIDER_ALREADY_LINKED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [auth]
      operationId: API-109
      summary: 로그인 수단 연동 해제
      description: F-01-08. 마지막 수단은 해제 불가(ERR-13).
      security:
        - member: []
      parameters:
        - $ref: '#/components/parameters/LinkProvider'
      responses:
        '200':
          description: 남은 수단 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      providers:
                        type: array
                        items: { $ref: '#/components/schemas/AuthProvider' }
        '400':
          description: ERR-13 LAST_AUTH_METHOD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403': { $ref: '#/components/responses/MemberOnly' }

  # ---------------------------------------------------------------- API-2xx 회원
  /users/me:
    get:
      tags: [users]
      operationId: API-201
      summary: 내 정보 조회
      description: F-02-01, F-06-01, F-03-04.
      responses:
        '200':
          description: 내 정보
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [users]
      operationId: API-202
      summary: 내 정보 수정 (닉네임, 학습 알림 on/off)
      description: |
        F-02-02, F-03-03, F-15-05. 닉네임은 앞뒤 공백을 뺀 1~10자이며 다른 계정과 같아도 됩니다.
        닉네임을 저장하면 `nicknameRequired`가 false가 됩니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string, minLength: 1, maxLength: 10 }
                pushEnabled: { type: boolean }
      responses:
        '200':
          description: 갱신된 내 정보
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [auth]
      operationId: API-110
      summary: 회원 탈퇴
      description: |
        F-01-09. 즉시 status=WITHDRAWN, 토큰·로그인 수단·Push 토큰 삭제, 하우징 비공개.
        개인정보(email, nickname)와 나머지 데이터는 90일 후 배치 삭제.
      security:
        - member: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        '204': { description: 탈퇴 완료 }
        '403': { $ref: '#/components/responses/MemberOnly' }

  # ---------------------------------------------------------------- API-3xx 알림
  /push/devices:
    put:
      tags: [push]
      operationId: API-301
      summary: Push 디바이스 토큰 등록/갱신
      description: F-03-01. `(deviceUuid)` 기준 upsert.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceUuid, platform, pushToken]
              properties:
                deviceUuid: { type: string, format: uuid }
                platform: { $ref: '#/components/schemas/Platform' }
                pushToken: { type: string }
      responses:
        '204': { description: 등록됨 }
        '400': { $ref: '#/components/responses/ValidationFailed' }

  /push/devices/{deviceUuid}:
    delete:
      tags: [push]
      operationId: API-302
      summary: Push 디바이스 토큰 삭제
      description: F-03-02.
      parameters:
        - name: deviceUuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 삭제됨 }

  # ---------------------------------------------------------------- API-4xx 학습
  /courses:
    get:
      tags: [learning]
      operationId: API-401
      summary: 코스(별자리) 목록
      description: |
        F-04-02. 별자리를 정해진 순서(`order`)대로 돌려줍니다. ONBOARDING 코스는 제외합니다.
        앞 별자리의 레슨을 모두 완료해야 다음 별자리가 열립니다. 분야·주제 선택은 MVP에서 제외합니다.
      responses:
        '200':
          description: 코스 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      courses:
                        type: array
                        items: { $ref: '#/components/schemas/CourseSummary' }

  /courses/{courseId}:
    get:
      tags: [learning]
      operationId: API-402
      summary: 코스(별자리) 상세와 레슨 목록
      description: |
        F-04-03, F-04-08. 레슨은 정해진 순서대로 한 개씩 열립니다. 하루 해금 제한은 없습니다.
        첫 레슨은 앞 별자리를 모두 완료했을 때, 나머지 레슨은 바로 앞 레슨을 완료했을 때 UNLOCKED가 됩니다.
        조회만으로 상태를 바꾸지 않습니다.
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: 코스 상세
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CourseDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /lessons/{lessonId}:
    get:
      tags: [learning]
      operationId: API-403
      summary: 레슨 상세 (컨텐츠 목록)
      description: |
        F-04-01. 나레이션·개념·퀴즈 컨텐츠를 순서대로 돌려줍니다. 퀴즈 정답·해설은 제외합니다.
        복습 전용 문제는 레슨 컨텐츠에 포함하지 않습니다.
      parameters:
        - $ref: '#/components/parameters/LessonId'
      responses:
        '200':
          description: 레슨 상세
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LessonDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /lessons/{lessonId}/start:
    post:
      tags: [learning]
      operationId: API-404
      summary: 레슨 시작 / 이어하기 / 다시 하기
      description: |
        F-04-04, F-04-07, F-04-10.
        1) 열리지 않은 레슨이면 ERR-20 → 2) UNLOCKED이면 IN_PROGRESS로 바꿉니다.
        IN_PROGRESS 레슨은 저장된 위치와 입력(`progress.draft`)을 함께 돌려줍니다. `restart=true`면 저장된 위치와 입력을 지우고 첫 컨텐츠부터 시작합니다.
        `replay=true`는 COMPLETED 레슨 다시 하기입니다(진행 상태 불변).
        시작할 때는 에너지를 쓰지 않습니다. 에너지가 0이어도 학습할 수 있으며, 보상을 아직 받지 않은 레슨에 에너지 0으로 진입하면
        `energyNotice=true`를 돌려줍니다(앱은 에너지 소진 안내를 표시).
      parameters:
        - $ref: '#/components/parameters/LessonId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                replay: { type: boolean, default: false }
                restart:
                  type: boolean
                  default: false
                  description: 이어하기 확인에서 처음부터를 고른 경우 true
      responses:
        '200':
          description: 레슨 시작 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LessonStartResponse' }
        '403':
          description: ERR-20 LESSON_LOCKED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /lessons/{lessonId}/progress:
    put:
      tags: [learning]
      operationId: API-409
      summary: 레슨 진행 저장 (도중 나가기)
      description: |
        학습 도중 나가기에서 호출합니다. 현재 컨텐츠 위치와 아직 제출하지 않은 입력을 저장하고, 다음 이어하기에서 복원합니다.
        `draft.input`은 앱이 정한 형식의 JSON이며 서버는 해석하지 않습니다(최대 4KB).
        저장에 실패하면 앱은 현재 화면과 입력을 유지하고 다시 시도합니다.
      parameters:
        - $ref: '#/components/parameters/LessonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentId]
              properties:
                contentId:
                  type: integer
                  format: int64
                  description: 현재 보고 있는 컨텐츠
                draft:
                  allOf:
                    - $ref: '#/components/schemas/LessonDraft'
                  nullable: true
      responses:
        '200':
          description: 저장된 진행 상태
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      progress: { $ref: '#/components/schemas/LessonProgress' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '409':
          description: ERR-07 진행 중이 아닌 레슨이거나 아직 도달하지 않은 컨텐츠
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /contents/{contentId}/complete:
    post:
      tags: [learning]
      operationId: API-405
      summary: 컨텐츠 완료 보고 (이어하기 위치 갱신)
      description: |
        F-04-05, F-04-09. 컨텐츠는 순서대로만 완료할 수 있고, 퀴즈는 답안을 제출해야 완료됩니다.
        완료하면 저장된 미제출 입력(draft)을 지웁니다.
        마지막 컨텐츠면 레슨 완료 처리와 보상 지급까지 수행하고 `lessonCompleted=true`와 보상 본문을 함께 돌려줍니다.
        보상 규칙은 API-407과 같습니다. 같은 컨텐츠를 다시 완료해도 완료 기록·보상·에너지 사용은 중복되지 않습니다.
      parameters:
        - name: contentId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 진행 상태
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      progress: { $ref: '#/components/schemas/LessonProgress' }
                      lessonCompleted: { type: boolean }
                      completion:
                        $ref: '#/components/schemas/LessonCompleteResponse'
        '409':
          description: ERR-07 앞 컨텐츠 미완료 또는 퀴즈 미제출
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /quizzes/{quizId}/answer:
    post:
      tags: [learning]
      operationId: API-406
      summary: 퀴즈 답안 제출·채점
      description: |
        F-04-06, F-06-03, F-03-04. 채점 후 정답·해설을 돌려주고 답안을 기록합니다.
        `QuizAnswer` 형식은 퀴즈의 `interactionType`과 일치해야 합니다.
        오답이어도 다시 풀지 않고 다음 컨텐츠로 넘어갑니다.
        학습 레슨의 첫 퀴즈(`graded=false`)는 채점하지 않습니다. 온보딩 퀴즈는 모두 채점합니다. 답안은 기록하지만 `isCorrect`는 null이고 `correctAnswer`를 돌려주지 않으며,
        레슨의 틀린 문제 집계와 복습 대상에 넣지 않습니다.
        레슨 학습(`replay=false`)의 채점 결과로 레슨별 오답 여부와 틀린 문제를 기록하며, 복습 출제(API-501)에 사용합니다. 학습일·연속일도 갱신합니다.
        복습 전용 문제는 이 API로 제출할 수 없습니다(API-502 사용).
      parameters:
        - name: quizId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { $ref: '#/components/schemas/QuizAnswer' }
                replay: { type: boolean, default: false }
      responses:
        '200':
          description: 채점 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AnswerResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }

  /lessons/{lessonId}/complete:
    post:
      tags: [learning]
      operationId: API-407
      summary: 레슨 완료 (보상 지급)
      description: |
        F-04-09, F-04-11, F-11-01, F-11-03, F-13-02/03.
        완료하면 항상 완료 기록을 남기고 별(STAR 뱃지)을 밝힙니다. 별가루 보상은 레슨별로 한 번만 받습니다.
        - 보상을 받지 않은 레슨을 에너지가 있는 상태로 완료: 별가루 +10, 에너지 −1 (`rewardStatus=GRANTED`)
        - 보상을 받지 않은 레슨을 에너지 0으로 완료: 별가루·에너지 변화 없음, 보상 미수령 유지 (`rewardStatus=NO_ENERGY`)
        - 이미 보상을 받은 레슨을 다시 완료: 추가 지급·차감 없음 (`rewardStatus=ALREADY_GRANTED`)
        첫 학습도 같은 규칙을 따르며 `firstLesson=true`로 첫 학습 완료 화면을 구분합니다.
        코스의 모든 레슨을 처음 완료하면 별자리 뱃지와 그 별자리의 완성 보너스를 함께 지급합니다. 에너지와 관계없이 한 번만 지급합니다.
        완성 보너스는 별자리마다 다르며 다음 형식의 조합입니다. 보너스를 등록하지 않은 별자리는 뱃지만 지급합니다.
        - 에너지: `type=WALLET, currency=ENERGY`. 최대치를 넘지 않게 지급하고, 넘친 에너지 1개당 별가루 10개를 `type=WALLET, currency=STARDUST, convertedEnergy=넘친 개수`로 지급합니다.
          예: 에너지 4/5에서 3개를 받으면 에너지 +1, 별가루 +20(`convertedEnergy=2`).
        - 상점 해금: `type=UNLOCK`. 가구(바닥·벽지)는 `itemId`, 색상 옵션은 `itemId`와 `optionId`. 무료 지급이 아니라 상점에서 살 수 있게 됩니다.
        - 세계관 스토리: `type=STORY, storyId`. 스토리 조회 API는 아직 없습니다.
        같은 `Idempotency-Key`로 다시 호출하면 같은 결과를 돌려주며, 완료 결과 확인에 실패한 앱은 같은 키로 결과를 다시 조회합니다.
        완료 화면에는 퀴즈 점수를 표시하지 않습니다.
      parameters:
        - $ref: '#/components/parameters/LessonId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 완료 결과와 지급된 보상
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LessonCompleteResponse' }
        '409':
          description: ERR-07 마지막 컨텐츠 미완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/me/progress:
    get:
      tags: [learning]
      operationId: API-408
      summary: 전체 진행 상황 (학습 홈)
      description: |
        F-04-08. `current`는 학습 홈의 물음표 별(지금 시작하거나 이어 갈 레슨)입니다.
        저장된 중단 지점이 있으면 `resumable=true`이며 앱은 같은 카드를 이어하기로 표시합니다.
        모든 레슨을 완료하면 `current`는 null입니다.
      responses:
        '200':
          description: 진행 상황
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      courses:
                        type: array
                        items:
                          type: object
                          properties:
                            courseId: { type: integer, format: int64 }
                            completedLessons: { type: integer }
                            totalLessons: { type: integer }
                      current:
                        type: object
                        nullable: true
                        properties:
                          lessonId: { type: integer, format: int64 }
                          courseId: { type: integer, format: int64 }
                          title: { type: string }
                          status: { $ref: '#/components/schemas/LessonStatus' }
                          resumable: { type: boolean }

  # ---------------------------------------------------------------- API-5xx 복습
  /reviews/status:
    get:
      tags: [review]
      operationId: API-504
      summary: 복습 가능 여부와 오늘 보상 상태
      description: |
        F-05-01. 학습 홈의 복습하기에서 호출합니다. 회차를 만들지 않습니다.
        `available=false`(후보 5개 미만)면 앱은 학습 홈 위에 문제 부족 팝업을, true면 복습 안내 화면을 표시합니다.
        `rewardEligible`은 오늘(KST) 복습 보상을 아직 받지 않았는지이며, 복습 안내 화면의 보상 상태 표시에 씁니다.
      responses:
        '200':
          description: 복습 상태
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ReviewStatus' }

  /reviews/next:
    get:
      tags: [review]
      operationId: API-501
      summary: 복습 회차 시작 (5문항)
      description: |
        F-05-01. 복습 안내 화면의 복습 시작에서 호출합니다. 호출할 때마다 새 회차를 만들고, 끝나지 않은 이전 회차는 종료합니다.
        후보는 재출제 제외 기간이 아닌 다음 두 종류입니다.
        - 완료한 레슨의 복습 전용 문제
        - 완료한 레슨에서 처음 학습할 때(`replay=false`) 틀린 퀴즈. 채점하지 않는 첫 퀴즈는 제외
        5자리를 다음 순서로 채웁니다.
        - 틀린 문제가 있는 완료 레슨에서 최대 4개. 그 레슨의 복습 전용 문제를 먼저 고르고, 모자라면 그 레슨에서 틀린 퀴즈로 채움
        - 모두 맞힌 완료 레슨의 복습 전용 문제에서 1개
        - 부족한 자리는 남은 후보에서 복습 전용 문제를 먼저, 그다음 틀린 퀴즈를 중복 없이 무작위로 채움
        같은 개념의 문제가 여러 개여도 문제마다 따로 후보로 관리합니다.
        후보가 5개 미만이면 회차를 만들지 않고 `reviewItems=[]`와 `message`를 돌려줍니다. API-504의 후보 수도 두 종류를 합해 셉니다.
        복습에는 에너지를 쓰지 않습니다.
      responses:
        '200':
          description: 복습 회차
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ReviewSet' }

  /reviews/{reviewItemId}/answer:
    post:
      tags: [review]
      operationId: API-502
      summary: 복습 답안 제출
      description: |
        F-05-03, F-05-06. 채점 결과와 정답·해설을 돌려줍니다.
        복습에서 푼 문제는 정답·오답과 관계없이 다음 날 00:00 KST부터 다시 후보가 됩니다(`excludedUntil`).
        오답은 다음 복습 후보로 돌아가는 것이 확정이며, 정답 문제의 재출제 시점은 잠정입니다.
        레슨에서 틀린 퀴즈도 같은 규칙을 따릅니다. 복습에서 맞혀도 후보에서 빠지지 않습니다.
        타일을 몇 개 벗겼는지, 줌아웃·점점 선명을 몇 단계 진행했는지는 저장하지 않으며 앱이 결과 문구로만 표시합니다.
      parameters:
        - name: reviewItemId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { $ref: '#/components/schemas/QuizAnswer' }
      responses:
        '200':
          description: 채점 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/AnswerResult'
                      - type: object
                        properties:
                          excludedUntil:
                            type: string
                            format: date-time
                            nullable: true
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: ERR-22 REVIEW_SESSION_CLOSED 종료된 회차의 문항
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /reviews/complete:
    post:
      tags: [review]
      operationId: API-503
      summary: 복습 회차 완료 (보상)
      description: |
        F-05-04, F-11-02. 회차의 5문항을 모두 제출했는지 확인하고 완료 처리합니다.
        한국 시간 기준 그날 첫 완료에만 별가루 +5를 지급합니다. 보상 여부는 시작이 아닌 완료 시각으로 판정하므로,
        23시대에 시작해 자정 이후 완료한 회차도 완료한 날의 보상으로 처리합니다. 레슨 완료 보상과는 따로 집계합니다.
        같은 `Idempotency-Key`로 다시 호출하면 같은 결과를 돌려주며 보상을 중복 지급하지 않습니다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewSessionId]
              properties:
                reviewSessionId: { type: integer, format: int64 }
      responses:
        '200':
          description: 완료 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ReviewCompleteResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '409':
          description: ERR-07 제출하지 않은 문항이 있음 / ERR-22 REVIEW_SESSION_CLOSED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /reviews/abandon:
    post:
      tags: [review]
      operationId: API-505
      summary: 복습 회차 종료 (도중 나가기)
      description: |
        복습 도중 나가기에서 호출합니다. 회차를 종료하며 완료 기록과 보상을 남기지 않습니다.
        종료한 회차는 이어 할 수 없고, 다시 시작하면 새 문항으로 첫 문제부터 진행합니다.
        이미 제출한 답안의 채점 결과(다음 복습 후보 반영)는 유지합니다. 이미 종료된 회차면 그대로 204를 돌려줍니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewSessionId]
              properties:
                reviewSessionId: { type: integer, format: int64 }
      responses:
        '204': { description: 종료됨 }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- API-6xx 온보딩
  /onboarding:
    get:
      tags: [onboarding]
      operationId: API-601
      summary: 온보딩 퀴즈 조회
      description: F-06-03. 온보딩 전용 코스(ONBOARDING)의 유일한 레슨과 퀴즈 컨텐츠. 코스 목록(API-401)에는 나오지 않습니다.
      responses:
        '200':
          description: 온보딩 레슨
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lesson: { $ref: '#/components/schemas/LessonDetail' }

  /onboarding/complete:
    post:
      tags: [onboarding]
      operationId: API-602
      summary: 온보딩 완료 또는 건너뛰기
      description: |
        F-06-04, F-06-05, F-11-06. `skipped=false`면 50 별가루 지급(1회), `skipped=true`면 보상 없이 완료 처리.
        건너뛴 뒤 다시 진행할 수 없습니다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skipped]
              properties:
                skipped: { type: boolean }
      responses:
        '200':
          description: 보상과 완료 상태
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/RewardResponse'
                      - type: object
                        properties:
                          onboardingCompleted: { type: boolean }

  # ---------------------------------------------------------------- API-7xx 하우징·아바타
  /housings/me:
    get:
      tags: [housing]
      operationId: API-701
      summary: 내 우주 조회 (홈)
      description: F-07-02, F-08-02, F-09-05.
      responses:
        '200':
          description: 내 하우징
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/HousingDetail' }
    patch:
      tags: [housing]
      operationId: API-703
      summary: 하우징 이름 · 공개 여부 변경
      description: F-07-07, F-09-02. 기본 공개 상태는 true입니다. `isPublic` 변경은 회원만(게스트 ERR-41).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 20 }
                isPublic: { type: boolean }
      responses:
        '200':
          description: 하우징
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Housing' }
        '403': { $ref: '#/components/responses/MemberOnly' }

  /housings/me/placements:
    put:
      tags: [housing]
      operationId: API-702
      summary: 배치 전체 저장 (꾸미기 모드 '저장하기')
      description: |
        F-07-04, F-07-05, F-14-04. 배치 전체를 교체합니다(최대 200개, 빈 배열 = 모두 회수).
        보유한 개별 inventoryId 하나당 배치 하나만 허용합니다. 대칭 반전은 허용하고 회전은 허용하지 않습니다.
        미보유·중복 배치 inventoryId는 ERR-30, 영역 불일치는 ERR-31.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [placements]
              properties:
                placements:
                  type: array
                  maxItems: 200
                  items: { $ref: '#/components/schemas/PlacementInput' }
      responses:
        '200':
          description: 저장된 배치
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      placements:
                        type: array
                        items: { $ref: '#/components/schemas/Placement' }
        '400':
          description: ERR-30 / ERR-31 / ERR-05
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /housings/me/avatar:
    patch:
      tags: [housing]
      operationId: API-704
      summary: 아바타 위치·상태 저장
      description: F-08-03. `placementId`는 본인 배치여야 함(ERR-32).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                x: { type: number, minimum: 0, maximum: 1 }
                y: { type: number, minimum: 0, maximum: 1 }
                state: { $ref: '#/components/schemas/AvatarState' }
                placementId:
                  type: integer
                  format: int64
                  nullable: true
      responses:
        '200':
          description: 아바타
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Avatar' }
        '400':
          description: ERR-32 PLACEMENT_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ---------------------------------------------------------------- API-8xx 커뮤니티
  /housings/explore:
    get:
      tags: [community]
      operationId: API-801
      summary: 공개 하우징 탐색 (우주 탐험)
      description: |
        F-09-01. 호출자 하우징이 비공개면 ERR-40. 본인·차단 관계·정지 중·탈퇴 유저는 제외.
      security:
        - member: []
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [recent, popular]
            default: recent
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 하우징 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      housings:
                        type: array
                        items: { $ref: '#/components/schemas/HousingCard' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '403':
          description: ERR-40 HOUSING_PRIVATE_SELF / ERR-41
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /housings/{housingId}:
    get:
      tags: [community]
      operationId: API-802
      summary: 다른 유저 하우징 구경
      description: F-09-03, F-08-02. 비공개·차단·정지·탈퇴 대상은 ERR-42(사유 비노출).
      security:
        - member: []
      parameters:
        - $ref: '#/components/parameters/HousingId'
      responses:
        '200':
          description: 하우징 상세
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/HousingDetail'
                      - type: object
                        properties:
                          ownerNickname: { type: string }
                          likedByMe: { type: boolean }
        '403':
          description: ERR-40 / ERR-41
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: ERR-42 HOUSING_NOT_VISIBLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /housings/{housingId}/like:
    post:
      tags: [community]
      operationId: API-803
      summary: 좋아요
      description: F-09-04. 멱등. 본인 하우징 ERR-43.
      security:
        - member: []
      parameters:
        - $ref: '#/components/parameters/HousingId'
      responses:
        '200':
          description: 좋아요 상태
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LikeState' }
        '400':
          description: ERR-43 SELF_TARGET
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: ERR-42 HOUSING_NOT_VISIBLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [community]
      operationId: API-804
      summary: 좋아요 취소
      description: F-09-04. 멱등.
      security:
        - member: []
      parameters:
        - $ref: '#/components/parameters/HousingId'
      responses:
        '200':
          description: 좋아요 상태
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LikeState' }

  /reports:
    post:
      tags: [community]
      operationId: API-805
      summary: 신고
      description: |
        F-09-06. 24시간 내 서로 다른 3명 이상이 같은 하우징(유저)을 신고하면 해당 유저는 30일간
        모든 유저에게서 숨겨집니다. 대상에게는 알리지 않습니다.
        신고 사유는 자유 입력(`detail`)으로 받습니다. 앱은 사유가 비어 있으면 접수 버튼을 비활성화합니다.
        `reason`은 선택이며 생략하면 OTHER로 저장합니다. 신고와 차단은 별개입니다.
      security:
        - member: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [housingId, detail]
              properties:
                housingId: { type: integer, format: int64 }
                reason: { $ref: '#/components/schemas/ReportReason' }
                detail:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: 자유 입력 신고 사유. 앞뒤 공백을 뺀 뒤 1자 이상
      responses:
        '200':
          description: 신고 접수
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      reportId: { type: integer, format: int64 }
        '400':
          description: ERR-43 SELF_TARGET / ERR-05
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /blocks:
    get:
      tags: [community]
      operationId: API-808
      summary: 차단한 사용자 목록
      description: F-09-07, F-15-05.
      security:
        - member: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 차단 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      users:
                        type: array
                        items:
                          type: object
                          properties:
                            userId: { type: integer, format: int64 }
                            nickname: { type: string }
                            blockedAt: { type: string, format: date-time }
                  meta: { $ref: '#/components/schemas/PageMeta' }

  /blocks/{userId}:
    post:
      tags: [community]
      operationId: API-806
      summary: 사용자 차단
      description: F-09-07. 양방향으로 탐색·조회에서 제외. 본인 ERR-43.
      security:
        - member: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204': { description: 차단됨 }
        '400':
          description: ERR-43 SELF_TARGET
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [community]
      operationId: API-807
      summary: 차단 풀기
      description: F-09-07.
      security:
        - member: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204': { description: 해제됨 }

  # ---------------------------------------------------------------- API-9xx 상점·보상·재화·별자리·인벤토리
  /shop/items:
    get:
      tags: [shop]
      operationId: API-901
      summary: 상점 목록
      description: F-10-01. 해금 여부, 옵션별 보유 여부, 최저 가격 포함.
      parameters:
        - name: itemType
          in: query
          schema: { $ref: '#/components/schemas/ItemType' }
      responses:
        '200':
          description: 아이템 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ShopItem' }

  /shop/items/{itemId}:
    get:
      tags: [shop]
      operationId: API-902
      summary: 아이템 상세 (옵션·가격·미리보기 에셋)
      description: F-10-02.
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 아이템 상세
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      item: { $ref: '#/components/schemas/ShopItem' }
                      options:
                        type: array
                        items: { $ref: '#/components/schemas/ShopOption' }
        '404': { $ref: '#/components/responses/NotFound' }

  /shop/purchases:
    post:
      tags: [shop]
      operationId: API-903
      summary: 구매 (여러 옵션 일괄, 전부 성공 또는 전부 실패)
      description: |
        F-10-04, F-15-04. 미리 배치한 아이템을 일괄 구매할 수 있습니다.
        같은 색상·모양 옵션의 아이템도 여러 개 구매할 수 있습니다.
        항목별 검증 순서: 아이템·옵션 해금(ERR-50) → 옵션 유효·판매 중(ERR-52) → 별가루 합계 잔액(ERR-51).
        하나라도 실패하면 전체 거부하고 `error.items[]`에 항목별 사유를 돌려줍니다.
        꾸미기 화면의 저장에서는 `placements`를 함께 보냅니다. 이때 구매와 배치 저장(API-702와 같은 규칙)을 한 번에 처리하며,
        둘 다 성공해야 별가루 차감·보유 수량·저장 배치를 반영합니다. 하나라도 실패하면 아무것도 반영하지 않습니다.
        `placements`의 `inventoryId`는 이미 보유한 개별 ID 또는 이번 구매분을 가리키는 `new:{index}:{n}`(items 순번, 수량 안 순번, 0부터)를 씁니다.
        결과가 불명확하면 같은 `Idempotency-Key`로 다시 요청해 이전 결과를 확인하며, 중복 차감·저장은 일어나지 않습니다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [itemId, optionId, quantity]
                    properties:
                      itemId: { type: integer }
                      optionId: { type: integer, format: int64 }
                      quantity: { type: integer, minimum: 1, maximum: 50 }
                placements:
                  type: array
                  maxItems: 200
                  description: 함께 저장할 배치 전체. 생략하면 구매만 합니다. 빈 배열은 모두 회수입니다.
                  items: { $ref: '#/components/schemas/PlacementInput' }
      responses:
        '200':
          description: 구매 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      inventoryItems:
                        type: array
                        items: { $ref: '#/components/schemas/InventoryItem' }
                      wallet: { $ref: '#/components/schemas/Wallet' }
                      placements:
                        type: array
                        description: placements를 보낸 경우 저장된 배치
                        items: { $ref: '#/components/schemas/Placement' }
        '400':
          description: ERR-52 OPTION_INVALID / ERR-30 / ERR-31 / ERR-05
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseErrorResponse' }
        '402':
          description: ERR-51 INSUFFICIENT_BALANCE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseErrorResponse' }
        '403':
          description: ERR-50 ITEM_LOCKED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseErrorResponse' }
  /users/me/wallet:
    get:
      tags: [shop]
      operationId: API-904
      summary: 재화 잔액
      description: F-12-02. 별가루와 에너지.
      responses:
        '200':
          description: 잔액
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Wallet' }

  /users/me/rewards:
    get:
      tags: [shop]
      operationId: API-905
      summary: 보상 지급 내역
      description: F-11-05.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 보상 내역
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      rewards:
                        type: array
                        items: { $ref: '#/components/schemas/RewardRecord' }
                  meta: { $ref: '#/components/schemas/PageMeta' }

  /constellations:
    get:
      tags: [shop]
      operationId: API-906
      summary: 별자리 목록과 획득 현황 (내 별자리 지도·기록)
      description: |
        F-13-04. 전체 별자리를 순서대로 돌려줍니다. 지도 탭은 전체 진행과 다음 목표를, 기록 탭은 완성한 별자리와 완성일을 표시합니다.
        별 수는 보상 지급이 아니라 레슨 완료 기록으로 셉니다. 에너지가 없어 보상을 받지 못한 레슨도 별을 밝힙니다.
        `stars`는 별자리 상세(완료한 별의 학습 제목)와 다시 학습 진입에 씁니다. 완료하지 않은 별은 `title`이 null이며 앱은 물음표로 표시합니다.
      responses:
        '200':
          description: 별자리
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      constellations:
                        type: array
                        items: { $ref: '#/components/schemas/Constellation' }

  /users/me/inventory:
    get:
      tags: [shop]
      operationId: API-907
      summary: 인벤토리 조회
      description: |
        F-14-01. 같은 아이템·옵션을 묶어 보유·배치·배치 가능 수와 개별 보유 ID를 돌려줍니다.
        고양이(`starter_cat`)는 위치·상태를 `Avatar`로 다루므로 나오지 않습니다.
        예전 방식의 기본 지급품(배경·벽·바닥·아바타·방)도 나오지 않습니다.
      parameters:
        - name: itemType
          in: query
          schema: { $ref: '#/components/schemas/ItemType' }
      responses:
        '200':
          description: 보유 아이템
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/InventoryItem' }

components:
  securitySchemes:
    guest:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 게스트 이상 (role=GUEST | MEMBER)
    member:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 회원만 (role=MEMBER). 게스트는 ERR-41 MEMBER_ONLY

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 24시간 내 같은 키는 같은 응답
      schema: { type: string, maxLength: 64 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    CourseId:
      name: courseId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    LessonId:
      name: lessonId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    HousingId:
      name: housingId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    OAuthProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [google, kakao, apple]
    LinkProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [email, google, kakao, apple]

  responses:
    Unauthorized:
      description: ERR-01 UNAUTHORIZED / ERR-03 AUTH_TOKEN_EXPIRED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    MemberOnly:
      description: ERR-41 MEMBER_ONLY
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: ERR-06 NOT_FOUND
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationFailed:
      description: ERR-05 VALIDATION_FAILED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: ERR-08 RATE_LIMITED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # ---- 공통
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: L3 ERR 표의 코드명
              enum:
                - UNAUTHORIZED
                - FORBIDDEN
                - AUTH_TOKEN_EXPIRED
                - AUTH_TOKEN_REUSED
                - VALIDATION_FAILED
                - NOT_FOUND
                - CONFLICT
                - RATE_LIMITED
                - INTERNAL
                - EMAIL_ALREADY_REGISTERED
                - PROVIDER_ALREADY_LINKED
                - ACCOUNT_LOCKED
                - LAST_AUTH_METHOD
                - ACCOUNT_EXISTS_FOR_PROVIDER
                - VERIFICATION_INVALID
                - LESSON_LOCKED
                - REVIEW_SESSION_CLOSED
                - INVENTORY_ITEM_NOT_OWNED
                - PLACEMENT_AREA_MISMATCH
                - PLACEMENT_NOT_FOUND
                - HOUSING_PRIVATE_SELF
                - MEMBER_ONLY
                - HOUSING_NOT_VISIBLE
                - SELF_TARGET
                - ITEM_LOCKED
                - INSUFFICIENT_BALANCE
                - OPTION_INVALID
            message: { type: string }
            fields:
              type: array
              description: VALIDATION_FAILED일 때 필드별 사유
              items:
                type: object
                properties:
                  field: { type: string }
                  reason: { type: string }
            retryAfter:
              type: integer
              description: ACCOUNT_LOCKED · RATE_LIMITED 시 초 단위
    PurchaseErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      itemId: { type: integer }
                      optionId: { type: integer, format: int64 }
                      code: { type: string }
    PageMeta:
      type: object
      properties:
        nextCursor:
          type: string
          nullable: true

    # ---- 열거형 (L3 ENUM)
    AuthProvider:
      type: string
      description: ENUM-01
      enum: [EMAIL, GOOGLE, KAKAO, APPLE, GUEST]
    UserStatus:
      type: string
      description: ENUM-02
      enum: [GUEST, ACTIVE, WITHDRAWN]
    Platform:
      type: string
      description: ENUM-03
      enum: [IOS, ANDROID, WEB]
    ContentType:
      type: string
      description: |
        ENUM-04. 학습 콘텐츠 시뮬레이터의 화면 유형.
        TEXT는 나레이션(화자별 대사), IMAGE는 개념 화면(그림·키워드·대사), QUIZ는 퀴즈입니다. 영상은 0.4.0에서 제외합니다.
      enum: [TEXT, IMAGE, QUIZ]
    QuizType:
      type: string
      description: |
        학습 콘텐츠 시뮬레이터의 퀴즈 유형. O/X, 하나 고르기, 여러 개 고르기, 빈칸, 슬라이더, 짝 맞추기, 초성.
        소리 듣고 고르기와 복습 유형(타일 벗기기, 줌아웃, 점점 선명, 틀린 곳 찾기)은 SINGLE의 `presentation`으로 표시합니다.
        순서 맞추기는 제공하지 않습니다.
      enum: [OX, SINGLE, MULTI, BLANK, SLIDER, MATCH, CHOSUNG]
    LessonStatus:
      type: string
      description: |
        ENUM-06. LOCKED는 아직 열리지 않은 레슨(응답 전용), UNLOCKED는 열렸지만 시작하지 않은 레슨입니다.
        레슨은 정해진 순서대로 앞 레슨을 완료하면 열립니다.
      enum: [LOCKED, UNLOCKED, IN_PROGRESS, COMPLETED]
    ItemType:
      type: string
      description: |
        ENUM-07. FLOOR는 바닥, WALL은 벽지입니다. 별자리 완성 보너스로 상점에서 해금됩니다.
        바닥·벽지를 우주선에 적용하는 저장 형식은 하우징 꾸미기 명세에서 정합니다.
      enum: [FURNITURE, OBJECT, FLOOR, WALL]
    ItemCategory:
      type: string
      description: |
        ENUM-07-1. 방 꾸미기 화면의 필터 탭에 쓰는 가구 분류입니다.
        PLANT 화분, RUG 러그, CHAIR 의자, LAMP 조명, DESK 책상, SHELF 책장, BED 침대.
        FLOOR·WALL 아이템은 분류가 없습니다(null).
      enum: [PLANT, RUG, CHAIR, LAMP, DESK, SHELF, BED]
    HousingItemType:
      type: string
      description: ENUM-08
      enum: [INTERIOR, EXTERIOR]
    AvatarState:
      type: string
      description: ENUM-09 (DB는 0/1/2)
      enum: [IDLE, SIT, SLEEP]
    ReportReason:
      type: string
      description: ENUM-10. 신고 화면은 자유 입력만 받으므로 앱은 보통 생략하며, 서버는 OTHER로 저장합니다.
      enum: [INAPPROPRIATE_NAME, ABUSE, SPAM, OTHER]
    CurrencyType:
      type: string
      description: 구매·보상 재화. ENERGY는 보상 지급에만 쓰며 상점 가격에는 쓰지 않습니다.
      enum: [STARDUST, ENERGY]
    RewardType:
      type: string
      description: |
        ENUM-12.
        - WALLET: 별가루·에너지 지급(`currency`, `amount`)
        - UNLOCK: 상점 해금(`itemId`, 색상 옵션이면 `optionId`도). 인벤토리에 넣지 않습니다.
        - INVENTORY: 아이템 무료 지급(`itemId`, `optionId`)
        - CONSTELLATION: 별(STAR)·별자리(CONSTELLATION) 뱃지(`badge`)
        - STORY: 세계관 스토리 해금(`storyId`)
        0.4.1에서 ARTWORK(레슨 완료 그림)를 없앴습니다.
      enum: [WALLET, UNLOCK, INVENTORY, CONSTELLATION, STORY]
    AcquiredVia:
      type: string
      description: ENUM-13
      enum: [PURCHASE, REWARD, STARTER]
    BadgeType:
      type: string
      description: ENUM-15
      enum: [STAR, CONSTELLATION]

    # ---- 인증·회원
    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn:
          type: integer
          description: access 토큰 수명(초), 3600
    UserBrief:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        userCode:
          type: string
          pattern: '^42[0-9]{6}$'
          description: |
            계정마다 부여하는 8자리 고유번호. userId와 별개이며 바뀌지 않습니다.
            42로 시작하며 계정 생성 순서대로 42001000부터 부여합니다. 게스트도 생성 시 받고, 회원으로 전환해도 유지합니다.
        nickname:
          type: string
          description: 표시용 닉네임. 규칙은 `Me.nickname`과 같습니다.
        nicknameRequired:
          type: boolean
          description: 규칙은 `Me.nicknameRequired`와 같습니다.
        status: { $ref: '#/components/schemas/UserStatus' }
    AuthResponse:
      type: object
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/TokenPair'
            - type: object
              properties:
                user: { $ref: '#/components/schemas/UserBrief' }
                isNew:
                  type: boolean
                  description: 이 호출로 계정이 새로 만들어졌는지
    Wallet:
      type: object
      properties:
        stardust: { type: integer, format: int64 }
        energy:
          type: integer
          minimum: 0
          maximum: 5
          description: |
            남은 에너지. 매일 00시(KST)에 최대치까지 채워지며 남은 개수는 이월하지 않습니다. 신규 사용자는 최대치로 시작합니다.
            최대치 5는 잠정값입니다. 에너지는 보상을 받는 레슨 완료 시 1개 쓰며, 학습과 복습을 제한하지 않습니다.
            보상으로 받는 에너지도 최대치를 넘지 않으며, 넘친 에너지는 1개당 별가루 10개로 지급합니다.
        energyResetsAt:
          type: string
          format: date-time
          description: 다음 충전 시각(다음 00시 KST).
    Me:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        userCode:
          type: string
          pattern: '^42[0-9]{6}$'
          description: 8자리 계정 고유번호. 규칙은 `UserBrief.userCode`와 같습니다.
        nickname:
          type: string
          description: |
            1~10자, 중복 허용. 닉네임을 저장하지 않은 회원은 `사용자`, 게스트는 `게스트`입니다.
        nicknameRequired:
          type: boolean
          description: |
            회원(ACTIVE)인데 닉네임을 저장하지 않았으면 true입니다. 게스트는 항상 false입니다.
            true면 앱은 닉네임 설정 모달을 띄우고, API-202로 저장해야 닫습니다.
        status: { $ref: '#/components/schemas/UserStatus' }
        providers:
          type: array
          items: { $ref: '#/components/schemas/AuthProvider' }
        wallet: { $ref: '#/components/schemas/Wallet' }
        progress:
          type: object
          properties:
            completedLessons: { type: integer }
            totalLessons: { type: integer }
        housing:
          type: object
          properties:
            isPublic: { type: boolean }
            likeCount: { type: integer }
        onboardingCompleted: { type: boolean }
        pushEnabled: { type: boolean }
        streakDays: { type: integer }
        lastStudyDate:
          type: string
          format: date
          nullable: true

    # ---- 학습
    CourseSummary:
      type: object
      description: 코스는 별자리 하나입니다.
      properties:
        courseId: { type: integer, format: int64 }
        slug:
          type: string
          description: 콘텐츠 시뮬레이터의 별자리 고정 키(예 firefly). 콘텐츠를 다시 가져와도 바뀌지 않습니다.
        title: { type: string, description: 별자리 이름 }
        description: { type: string, description: '별자리 주제. 예: 빛과 색' }
        order: { type: integer, minimum: 1, description: 별자리 진행 순서 }
        locked:
          type: boolean
          description: 앞 별자리를 모두 완료하지 않아 아직 시작할 수 없으면 true
        totalLessons: { type: integer }
        completedLessons: { type: integer }
        constellation:
          type: object
          nullable: true
          properties:
            constellationId: { type: integer, format: int64 }
            name: { type: string }
    LessonSummary:
      type: object
      description: 레슨은 별자리 안의 별 하나입니다.
      properties:
        lessonId: { type: integer, format: int64 }
        slug:
          type: string
          description: 콘텐츠 시뮬레이터의 레슨 고정 키(예 firefly/blue-pigment). 콘텐츠를 다시 가져와도 바뀌지 않습니다.
        title: { type: string }
        keyword: { type: string, description: 레슨 대표 키워드 }
        order: { type: integer }
        status: { $ref: '#/components/schemas/LessonStatus' }
        rewardReceived:
          type: boolean
          description: 이 레슨의 별가루 보상을 받았는지. false인 완료 레슨은 에너지가 있을 때 다시 완료하면 보상을 받습니다.
        completedAt:
          type: string
          format: date-time
          nullable: true
    CourseDetail:
      allOf:
        - $ref: '#/components/schemas/CourseSummary'
        - type: object
          properties:
            lessons:
              type: array
              items: { $ref: '#/components/schemas/LessonSummary' }
    QuizPublic:
      type: object
      description: 해설을 제외한 퀴즈. config는 interactionType에 대응합니다. 정답은 MULTI의 정답 순번과 MATCH의 짝만 공개합니다.
      required: [quizId, interactionType, question, config, quizOrder, graded]
      properties:
        quizId: { type: integer, format: int64 }
        lessonId: { type: integer, format: int64 }
        interactionType: { $ref: '#/components/schemas/QuizType' }
        graded:
          type: boolean
          description: |
            채점하는 퀴즈면 true. 학습 레슨에서 순서상 첫 퀴즈는 false입니다. 온보딩(API-601)과 복습 문제는 항상 true입니다.
            false면 앱은 결과 시트에 정답·오답을 표시하지 않습니다.
        question: { type: string }
        instruction: { type: string }
        config: { $ref: '#/components/schemas/QuizConfig' }
        difficulty: { type: string, maxLength: 30 }
        quizOrder: { type: integer, minimum: 1 }
    QuizConfig:
      oneOf:
        - $ref: '#/components/schemas/OxConfig'
        - $ref: '#/components/schemas/SingleConfig'
        - $ref: '#/components/schemas/MultiConfig'
        - $ref: '#/components/schemas/BlankConfig'
        - $ref: '#/components/schemas/SliderConfig'
        - $ref: '#/components/schemas/MatchConfig'
        - $ref: '#/components/schemas/ChosungConfig'
    OxConfig:
      type: object
      description: OX. 문장은 question에 있고 추가 구성은 없습니다.
      additionalProperties: false
    SingleConfig:
      type: object
      required: [options]
      properties:
        options:
          type: array
          description: 보기 문구. 답안은 0부터 시작하는 순번입니다.
          minItems: 2
          items: { type: string, minLength: 1 }
        presentation:
          $ref: '#/components/schemas/SinglePresentation'
      additionalProperties: false
    SinglePresentation:
      type: object
      description: |
        SINGLE의 화면 표시 방식. 생략하면 일반 보기 선택 화면을 사용한다.
        답안은 모든 방식에서 {"answer": 보기순번}이다.
        AUDIO는 소리 듣고 고르기(레슨), TILE·ZOOM_OUT·SHARPEN·INLINE_WORD는 복습 전용 문제의 타일 벗기기·줌아웃·점점 선명·틀린 곳 찾기다.
        TILE·ZOOM_OUT·SHARPEN은 시간이 아니라 사용자가 눌러서 진행한다. 사용자는 언제든 보기를 고를 수 있다.
        TILE은 벗기지 않은 타일을 누르면 그 타일이 벗겨지며 순서와 개수는 사용자가 정한다.
        ZOOM_OUT·SHARPEN은 이미지를 누를 때마다 `stages`의 다음 단계로 넘어간다.
        타일을 몇 개 벗겼는지, 몇 단계에서 맞혔는지는 앱이 결과 문구로만 표시하고 서버에 저장하지 않으며 점수·보상에 반영하지 않는다.
        AUDIO는 mediaUrl만, TILE은 mediaUrl·rows·columns, ZOOM_OUT과 SHARPEN은 mediaUrl·stages가 필수다.
        INLINE_WORD는 options를 문장 속 낱말 순서로 사용하며 추가 필드는 받지 않는다. 바른 낱말은 채점 결과(`AnswerResult.correctWord`)로만 돌려준다.
      required: [type]
      properties:
        type:
          type: string
          enum: [AUDIO, TILE, ZOOM_OUT, SHARPEN, INLINE_WORD]
        mediaUrl:
          type: string
          format: uri
          description: AUDIO 음원 또는 TILE/ZOOM_OUT/SHARPEN 이미지의 HTTP(S) 주소(S3). INLINE_WORD에서는 생략한다.
        stages:
          type: array
          minItems: 1
          maxItems: 64
          items: { type: integer, minimum: 0 }
          description: ZOOM_OUT은 배율(내림차순, 마지막은 1), SHARPEN은 흐림 반경(내림차순, 마지막은 0). AUDIO·TILE·INLINE_WORD에서는 생략한다. 점수·보상 계산에는 쓰지 않는다.
        columns: { type: integer, minimum: 2, maximum: 8, description: TILE의 가로 타일 수 }
        rows: { type: integer, minimum: 2, maximum: 8, description: TILE의 세로 타일 수 }
      additionalProperties: false
    MultiConfig:
      type: object
      required: [options, answers]
      properties:
        options:
          type: array
          description: 보기 문구. 답안은 0부터 시작하는 순번 목록입니다.
          minItems: 2
          items: { type: string, minLength: 1 }
        answers:
          type: array
          description: |
            정답 보기 순번 목록(오름차순). 앱은 보기를 고를 때마다 바로 판정합니다.
            오답을 고른 순간 그때까지 고른 순번 전체를, 정답을 모두 고른 순간 정답 순번 전체를 한 번 제출합니다.
          minItems: 1
          uniqueItems: true
          items: { type: integer, minimum: 0 }
      additionalProperties: false
    BlankConfig:
      type: object
      required: [before, after, options]
      properties:
        before: { type: string, minLength: 1, description: 빈칸 앞 문장 }
        after: { type: string, minLength: 1, description: 빈칸 뒤 문장 }
        options:
          type: array
          description: 빈칸에 넣을 낱말. 답안은 0부터 시작하는 순번입니다.
          minItems: 2
          items: { type: string, minLength: 1 }
      additionalProperties: false
    SliderConfig:
      type: object
      required: [ticks]
      properties:
        ticks:
          type: array
          description: 트랙 왼쪽부터 같은 간격으로 놓는 눈금 문구. 답안은 트랙 위치 0~1입니다.
          minItems: 2
          items: { type: string, minLength: 1 }
        hint: { type: string, minLength: 1, description: 안내 문구. 생략 시 앱 기본 문구 }
      additionalProperties: false
    MatchConfig:
      type: object
      required: [pairs]
      properties:
        pairs:
          type: array
          description: |
            [왼쪽, 오른쪽] 짝 목록이며 정답입니다. 앱은 오른쪽 열을 섞어 보여 주고 한 쌍씩 바로 판정합니다.
            모든 짝을 맞추면 맞춘 짝 전체를 제출합니다.
          minItems: 2
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: string, minLength: 1 }
      additionalProperties: false
    ChosungConfig:
      type: object
      required: [hint]
      properties:
        hint: { type: string, minLength: 1, description: '초성 힌트. 예: ㅇㅌㄹㅁㄹ' }
      additionalProperties: false
    Content:
      type: object
      required: [contentId, order, contentType, segmentId]
      properties:
        contentId: { type: integer, format: int64 }
        order: { type: integer }
        segmentId: { type: string }
        contentType: { $ref: '#/components/schemas/ContentType' }
        body:
          type: string
          nullable: true
          description: 대사 없이 문장 하나만 보여 줄 때 사용합니다. 보통은 dialogue를 씁니다.
        mediaUrl:
          type: string
          format: uri-reference
          nullable: true
          description: IMAGE(개념) 화면의 그림 주소(S3).
        keyword:
          type: string
          nullable: true
          description: IMAGE(개념) 화면에서 그림과 함께 강조해 보여 줄 개념 키워드. 예 청금석
        dialogue:
          type: array
          description: TEXT(나레이션)와 IMAGE(개념) 화면의 화자별 대사. 배열 순서대로 표시하며 탭할 때 다음 대사를 드러냅니다.
          items: { $ref: '#/components/schemas/DialogueLine' }
        source:
          type: string
          description: 화면에 표시할 학습 자료 출처. 출처가 없으면 생략합니다.
        quiz:
          allOf:
            - $ref: '#/components/schemas/QuizPublic'
          nullable: true
    DialogueLine:
      type: object
      required: [text]
      properties:
        speaker:
          type: string
          description: 화자(별지기, 초롱이 등). 화자 없이 해설처럼 보여 주는 대사는 생략합니다.
        text: { type: string }
    LessonSegment:
      type: object
      required: [segmentId, title, order, contentIds]
      properties:
        segmentId: { type: string }
        title: { type: string }
        order: { type: integer, minimum: 1 }
        contentIds:
          type: array
          minItems: 1
          items: { type: integer, format: int64 }
    LessonDetail:
      type: object
      properties:
        lessonId: { type: integer, format: int64 }
        courseId: { type: integer, format: int64 }
        slug: { type: string, description: 레슨 고정 키 }
        title: { type: string }
        keyword: { type: string }
        description: { type: string }
        version:
          type: integer
          minimum: 1
          description: 콘텐츠 버전. 콘텐츠를 고쳐 다시 가져오면 올라갑니다.
        source:
          type: string
          description: 레슨 전체의 참고 자료
        ending:
          type: object
          description: 별 점등 화면에 보여 줄 엔딩
          properties:
            text: { type: string, description: '예: 별에 불 들어왔다냥!' }
            imageUrl:
              type: string
              format: uri
              nullable: true
              description: 점등된 별 그림. 없으면 앱 기본 그림
        segments:
          type: array
          description: 레슨 상단 구간 표시와 구간별 현재 단계 계산에 사용합니다.
          items: { $ref: '#/components/schemas/LessonSegment' }
        contents:
          type: array
          description: 복습 전용 문제를 제외한 레슨 컨텐츠
          items: { $ref: '#/components/schemas/Content' }
    LessonDraft:
      type: object
      required: [contentId, input]
      description: 이어하기에서 복원할, 아직 제출하지 않은 입력
      properties:
        contentId: { type: integer, format: int64 }
        input:
          type: object
          additionalProperties: true
          description: '앱이 정한 입력 상태. 예: 초성 입력 문자열, 슬라이더 위치, 고른 보기'
    LessonProgress:
      type: object
      properties:
        status: { $ref: '#/components/schemas/LessonStatus' }
        lastContentId:
          type: integer
          format: int64
          nullable: true
          description: 마지막으로 완료한 컨텐츠
        resumeContentId:
          type: integer
          format: int64
          nullable: true
          description: 이어하기 시작 컨텐츠
        draft:
          allOf:
            - $ref: '#/components/schemas/LessonDraft'
          nullable: true
        contentVersion:
          type: integer
          description: 진행을 저장한 시점의 레슨 버전. 현재 버전과 다르면 서버는 저장 위치를 보정하고 draft를 버립니다.
    LessonStartResponse:
      type: object
      properties:
        progress: { $ref: '#/components/schemas/LessonProgress' }
        energyNotice:
          type: boolean
          description: 보상 미수령 레슨에 에너지 0으로 진입했으면 true. 앱은 에너지 소진 안내를 표시합니다.
        contents:
          type: array
          items: { $ref: '#/components/schemas/Content' }
        segments:
          type: array
          items: { $ref: '#/components/schemas/LessonSegment' }
    QuizAnswer:
      description: |
        interactionType별 답안. 정답 표시(correctAnswer)도 같은 모양입니다.
        - OX: `{ "answer": true }`
        - SINGLE·BLANK: `{ "answer": 1 }` (보기 순번, 0부터)
        - MULTI: `{ "answers": [1, 2] }` (순서 무관)
        - SLIDER: `{ "answer": 0.28 }` (트랙 위치 0~1)
        - MATCH: `{ "pairs": [["왼쪽", "오른쪽"], ...] }` (짝 전체, 순서 무관)
        - CHOSUNG: `{ "answer": "울트라마린" }` (공백을 빼고 비교. 인정 답안이 여러 개면 정답 표시는 대표 답안 하나)
      oneOf:
        - type: object
          description: OX
          required: [answer]
          properties:
            answer: { type: boolean }
          additionalProperties: false
        - type: object
          description: SINGLE·BLANK
          required: [answer]
          properties:
            answer: { type: integer, minimum: 0 }
          additionalProperties: false
        - type: object
          description: MULTI
          required: [answers]
          properties:
            answers:
              type: array
              minItems: 1
              uniqueItems: true
              items: { type: integer, minimum: 0 }
          additionalProperties: false
        - type: object
          description: SLIDER
          required: [answer]
          properties:
            answer: { type: number, minimum: 0, maximum: 1 }
          additionalProperties: false
        - type: object
          description: MATCH
          required: [pairs]
          properties:
            pairs:
              type: array
              items:
                type: array
                minItems: 2
                maxItems: 2
                items: { type: string }
          additionalProperties: false
        - type: object
          description: CHOSUNG
          required: [answer]
          properties:
            answer: { type: string, minLength: 1 }
          additionalProperties: false
    AnswerResult:
      type: object
      required: [graded, isCorrect, completed]
      properties:
        attemptId: { type: integer, format: int64 }
        graded:
          type: boolean
          description: 채점한 문항이면 true. 학습 레슨의 첫 퀴즈는 false입니다.
        isCorrect:
          type: boolean
          nullable: true
          description: 정답 여부. `graded=false`면 null입니다.
        completed:
          type: boolean
          description: 유효한 제출이면 true.
        correctAnswer:
          allOf:
            - $ref: '#/components/schemas/QuizAnswer'
          description: 완료된 문항에서 정답 표시용으로 반환합니다. `graded=false`면 생략합니다.
        correctWord:
          type: string
          description: |
            틀린 곳 찾기(SINGLE + INLINE_WORD)에서만 반환합니다. 틀린 낱말 자리에 들어갈 바른 낱말이며,
            앱은 결과 화면에서 틀린 낱말 옆에 표시합니다. 예 "산소" → "헬륨".
        explanation:
          type: string
          description: |
            해설. 앱은 결과 시트에 정답·오답, 해설, [다음] 버튼을 표시합니다.
            해설이 없는 문항은 생략하며, 앱은 시트에 정답·오답과 [다음]만 표시합니다.
            `graded=false`인 문항은 정답·오답 없이 해설(있으면)과 [다음]만 표시합니다.
        closeness:
          type: integer
          minimum: 0
          maximum: 100
          description: SLIDER만. 정답 위치에 얼마나 가까운지. 화면 문구 예시 "정답에 78% 근접했어요".
        source:
          type: string
          description: 해설의 출처. 없으면 생략합니다.
        streakDays: { type: integer }
    Reward:
      type: object
      properties:
        type: { $ref: '#/components/schemas/RewardType' }
        currency:
          allOf:
            - $ref: '#/components/schemas/CurrencyType'
          nullable: true
        amount:
          type: integer
          format: int64
          nullable: true
        convertedEnergy:
          type: integer
          minimum: 1
          description: 에너지가 최대치를 넘어 별가루로 바꿔 지급한 경우 넘친 에너지 개수. 그 밖에는 생략합니다.
        itemId:
          type: integer
          nullable: true
        optionId:
          type: integer
          format: int64
          nullable: true
          description: UNLOCK이면 해금한 색상 옵션(아이템 전체 해금이면 null), INVENTORY면 지급한 옵션
        storyId:
          type: integer
          format: int64
          nullable: true
          description: STORY일 때 해금한 세계관 스토리
        badge:
          type: object
          nullable: true
          properties:
            badgeType: { $ref: '#/components/schemas/BadgeType' }
            constellationId: { type: integer, format: int64 }
            lessonId:
              type: integer
              format: int64
              nullable: true
    RewardResponse:
      type: object
      properties:
        rewards:
          type: array
          items: { $ref: '#/components/schemas/Reward' }
        wallet: { $ref: '#/components/schemas/Wallet' }
    LessonCompleteResponse:
      allOf:
        - $ref: '#/components/schemas/RewardResponse'
        - type: object
          properties:
            rewardStatus:
              type: string
              enum: [GRANTED, NO_ENERGY, ALREADY_GRANTED]
              description: |
                GRANTED 별가루 +10·에너지 −1, NO_ENERGY 에너지가 없어 보상 미수령 유지, ALREADY_GRANTED 이미 받은 레슨이라 변화 없음.
            firstLesson:
              type: boolean
              description: 계정의 첫 레슨 완료면 true. 첫 학습 완료 화면에 씁니다.
            firstCompletion:
              type: boolean
              description: 이 레슨을 처음 완료(별을 처음 밝힘)했으면 true. 다시 학습이면 false
            courseCompleted:
              type: boolean
              description: 이번 완료로 별자리를 처음 완성했으면 true. 앱은 별자리 완성 화면으로 연결합니다.
            nextLesson:
              type: object
              nullable: true
              description: 다음에 열린 레슨. 모든 레슨을 완료했으면 null
              properties:
                lessonId: { type: integer, format: int64 }
                courseId: { type: integer, format: int64 }
                title: { type: string }
    RewardRecord:
      allOf:
        - $ref: '#/components/schemas/Reward'
        - type: object
          properties:
            source:
              type: object
              properties:
                courseId: { type: integer, format: int64 }
                lessonId: { type: integer, format: int64 }
                courseTitle: { type: string }
                lessonTitle: { type: string }
            grantedAt: { type: string, format: date-time }

    # ---- 복습
    ReviewItem:
      type: object
