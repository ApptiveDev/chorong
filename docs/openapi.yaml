openapi: 3.1.0
info:
  title: 초롱 서비스 API
  version: 0.3.0
  description: |
    초롱 서비스 명세서 L3의 API 명세를 OpenAPI로 옮긴 문서입니다.
    - `operationId`는 L3 명세서의 API 번호(API-101 …)와 같습니다.
    - 인증: `Authorization: Bearer <accessToken>`. 게스트도 같은 헤더를 씁니다.
      보안 요구사항 `guest`는 게스트 이상, `member`는 회원(role=MEMBER)만 허용(게스트는 ERR-41).
    - 시간은 ISO 8601 UTC. 목록은 `cursor`/`size` 커서 페이지네이션(`meta.nextCursor`).
    - 상태를 바꾸는 POST 일부는 `Idempotency-Key` 헤더를 받으며 24시간 내 같은 키는 같은 응답을 돌려줍니다.
    - 에러 응답 본문은 `{ "error": { "code": "...", "message": "..." } }` 이고, 코드 목록은 L3의 ERR 표를 따릅니다.
    - 이 문서는 신규 /api/v1 계약입니다. 기존 /api 경로의 요청·응답·상태 코드는 유지합니다.
    - 퀴즈는 기존 8종의 interactionType·config·response 계약을 사용합니다.
      정답 객체는 조회·채점 응답에 포함하지 않습니다. FLIP_CARD는 모든 짝이 맞아야 완료입니다.
    - 신규 학습·복습 결과는 data 아래에 attemptId·graded·correct·completed·explanation·streakDays를 담습니다.
      기존 개발자 도구와 제출 API의 응답은 바꾸지 않습니다.
servers:
  - url: https://api-chorong.bawibase.com/api/v1
    description: production
  - url: https://api-chorong-dev.bawibase.com/api/v1
    description: development

tags:
  - name: auth
    description: F-01 인증 (API-1xx)
  - name: users
    description: F-02 회원 정보 (API-2xx)
  - name: push
    description: F-03 알림 (API-3xx)
  - name: learning
    description: F-04 퀴즈와 학습 (API-4xx)
  - name: review
    description: F-05 복습하기 (API-5xx)
  - name: onboarding
    description: F-06 온보딩 (API-6xx)
  - name: housing
    description: F-07 하우징 · F-08 아바타 (API-7xx)
  - name: community
    description: F-09 커뮤니티 (API-8xx)
  - name: shop
    description: F-10 상점 · F-11 보상 · F-12 재화 · F-13 별자리 · F-14 인벤토리 (API-9xx)

security:
  - guest: []

paths:
  # ---------------------------------------------------------------- API-1xx 인증
  /auth/guest:
    post:
      tags: [auth]
      operationId: API-101
      summary: 게스트 계정 생성 또는 디바이스 자동 로그인
      description: |
        F-01-01, F-02-05, F-07-01. 같은 `deviceUuid`가 이미 있으면 기존 게스트 계정을 돌려주고,
        없으면 users · user_auth · auth_guest · 하우징 · 아바타 · 지갑을 함께 생성합니다.
        UUID는 정규 36자 형식이며 대소문자를 구분하지 않습니다. platform은 IOS 또는 ANDROID입니다.
        isNew는 이 요청이 계정을 생성했을 때만 true입니다. 기존 자산은 초기화하지 않습니다.
        기본 에셋 누락 시 신규 생성 전체를 되돌리고 CONFLICT를 반환합니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceUuid, platform]
              properties:
                deviceUuid: { type: string, format: uuid }
                platform: { $ref: '#/components/schemas/Platform' }
      responses:
        '200':
          description: 토큰 쌍과 유저
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400': { $ref: '#/components/responses/ValidationFailed' }

        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: CONFLICT. 초기 에셋을 구성할 수 없거나 기존 UUID가 여러 계정과 겹침.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/email/signup:
    post:
      tags: [auth]
      operationId: API-102
      summary: 이메일 회원가입 – 인증코드 발송
      description: |
        인증된 게스트 또는 회원이 요청합니다. 게스트 인증 완료는 회원 전환이며, 회원 인증 완료는 같은 회원에 EMAIL 수단을 추가합니다. 이메일은 소문자로 정규화하며 6자리 코드의 유효기간은 10분입니다.
        같은 이메일은 계정과 관계없이 60초 안에 재발송할 수 없습니다. 재발송은 이전 미사용 세션을 무효화합니다.
        실제 메일 발송기는 아직 연결되지 않았습니다. 발송 실패 시 세션을 생성하지 않고 500을 반환합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password:
                  type: string
                  minLength: 8
                  maxLength: 64
                  description: 영문·숫자 포함
      responses:
        '200':
          description: 인증 세션
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      verificationId: { type: string }
                      expiresAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: FORBIDDEN. 게스트 계정이 아닙니다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: ERR-10 EMAIL_ALREADY_REGISTERED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500':
          description: INTERNAL. 메일 발송 실패 또는 발송기 미설정.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/email/verify:
    post:
      tags: [auth]
      operationId: API-103
      summary: 이메일 인증코드 확인 (가입 완료)
      description: |
        게스트 토큰으로 호출하면 현재 게스트 계정에 EMAIL 수단을 붙이고 status를 ACTIVE로 바꿉니다.
        회원 토큰으로 호출하면 현재 회원 계정에 EMAIL 수단을 추가합니다. 해당 이메일이 이미 다른 회원 계정에
        있으면 ERR-14. 코드 불일치·만료·사용·무효화·소유자 불일치는 ERR-15입니다.
        인증 세션에서 코드를 5회 잘못 입력하면 세션을 무효화합니다. 기기 식별을 위해 현재 액세스 토큰에 세션 정보가 필요합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verificationId, code]
              properties:
                verificationId: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: 토큰 쌍과 유저
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          description: ERR-15 VERIFICATION_INVALID / ERR-05
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: ERR-14 ACCOUNT_EXISTS_FOR_PROVIDER
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/email/login:
    post:
      tags: [auth]
      operationId: API-104
      summary: 이메일 로그인
      description: |
        F-01-03. 연속 5회 실패하면 다섯 번째 요청부터 15분간 423 ACCOUNT_LOCKED와 retryAfter(초)를 반환합니다.
        구 password 로그인과 실패 횟수·잠금을 공유합니다. 잠금이 만료되면 다음 시도부터 다시 검사합니다.
        이메일 대소문자는 구분하지 않으며 성공하면 실패 횟수를 초기화합니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, deviceUuid]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                deviceUuid: { type: string, format: uuid }
      responses:
        '200':
          description: 토큰 쌍과 유저
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423':
          description: ERR-12 ACCOUNT_LOCKED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/oauth/{provider}:
    post:
      tags: [auth]
      operationId: API-105
      summary: OAuth 가입/로그인 (구글·카카오·애플)
      description: |
        F-01-04, F-02-03. `(provider, providerUid)` 일치 계정이 있으면 로그인, 없으면 신규 가입.
        게스트 토큰으로 호출하면 전환 가입(이미 다른 회원 계정에 있는 수단이면 ERR-14).
        google은 idToken, kakao는 accessToken, apple은 idToken과 authorizationCode를 받습니다. Google은 서명·issuer·audience·만료·sub를 검증합니다. 이메일로 계정을 합치지 않습니다.
        GOOGLE_OAUTH_CLIENT_IDS, KAKAO_OAUTH_APP_ID, APPLE_OAUTH_CLIENT_ID·TEAM_ID·KEY_ID·PRIVATE_KEY 설정이 필요합니다. Apple은 ES256 서명과 authorization code 교환을 확인합니다.
      security:
        - {}
        - guest: []
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceUuid]
              properties:
                idToken:
                  type: string
                  description: google · apple ID 토큰
                accessToken:
                  type: string
                  description: kakao access token
                authorizationCode:
                  type: string
                  description: apple authorization code
                deviceUuid: { type: string, format: uuid }
      responses:
        '200':
          description: 토큰 쌍과 유저
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: FORBIDDEN. 게스트가 아닌 계정의 전환 요청.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: ERR-14 ACCOUNT_EXISTS_FOR_PROVIDER 또는 초기 에셋 누락 CONFLICT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: INTERNAL. Google client ID 미설정 또는 공개키 조회 실패.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/token/refresh:
    post:
      tags: [auth]
      operationId: API-106
      summary: 토큰 갱신 (refresh 회전)
      description: |
        F-01-05. refreshToken과 deviceUuid가 일치해야 합니다. 회전한 토큰은 다시 쓸 수 없습니다.
        폐기된 토큰 재사용은 AUTH_TOKEN_REUSED이며 해당 유저의 모든 refresh 토큰을 폐기합니다.
        만료된 미폐기 토큰은 AUTH_TOKEN_EXPIRED이며 다른 토큰을 폐기하지 않습니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken, deviceUuid]
              properties:
                refreshToken: { type: string }
                deviceUuid: { type: string, format: uuid }
      responses:
        '200':
          description: 새 토큰 쌍
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: UNAUTHORIZED / AUTH_TOKEN_EXPIRED / AUTH_TOKEN_REUSED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: API-107
      summary: 로그아웃
      description: |
        F-01-06. 현재 액세스 토큰의 세션에 연결된 기기의 refresh 토큰과 Push 등록을 폐기합니다.
        all=true면 전체 기기의 refresh 토큰과 Push 등록을 폐기합니다. 세션 정보가 없는 기존 액세스 토큰은
        all=false에 사용할 수 없으므로 재로그인 또는 토큰 갱신이 필요합니다.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                all: { type: boolean, default: false }
      responses:
        '204': { description: 완료 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/link/{provider}:
    post:
      tags: [auth]
      operationId: API-108
      summary: 로그인 수단 연동
      description: |
        회원만 연동할 수 있습니다. 다른 계정에 연결된 수단이면 상대 계정 정보를 노출하지 않고 ERR-11로 거절합니다.
        email은 API-103 성공 후 반환된 verificationId, google은 idToken, kakao는 accessToken, apple은 idToken과 authorizationCode를 받습니다.
      security:
        - member: []
      parameters:
        - $ref: '#/components/parameters/LinkProvider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idToken: { type: string }
                accessToken: { type: string }
                authorizationCode: { type: string }
                verificationId: { type: string }
      responses:
        '200':
          description: 연동된 수단 목록. 이메일은 EMAIL로 표시합니다.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      providers:
                        type: array
                        items: { $ref: '#/components/schemas/AuthProvider' }
        '403': { $ref: '#/components/responses/MemberOnly' }
        '409':
          description: ERR-11 PROVIDER_ALREADY_LINKED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [auth]
      operationId: API-109
      summary: 로그인 수단 연동 해제
      description: F-01-08. 마지막 수단은 해제 불가(ERR-13).
      security:
        - member: []
      parameters:
        - $ref: '#/components/parameters/LinkProvider'
      responses:
        '200':
          description: 남은 수단 목록. 이메일은 EMAIL로 표시합니다.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      providers:
                        type: array
                        items: { $ref: '#/components/schemas/AuthProvider' }
        '400':
          description: ERR-13 LAST_AUTH_METHOD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403': { $ref: '#/components/responses/MemberOnly' }

  # ---------------------------------------------------------------- API-2xx 회원
  /users/me:
    get:
      tags: [users]
      operationId: API-201
      summary: 내 정보 조회
      description: F-02-01, F-06-01, F-03-04.
      responses:
        '200':
          description: 내 정보
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [users]
      operationId: API-202
      summary: 내 정보 수정 (닉네임, 학습 알림 on/off)
      description: F-02-02, F-03-03, F-15-05. GUEST와 ACTIVE 모두 수정할 수 있다. 생략하거나 null인 항목은 변경하지 않으며, 변경할 값이 하나 이상 필요하다. nickname은 null로 지울 수 없다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string, minLength: 2, maxLength: 12, nullable: true }
                pushEnabled: { type: boolean, nullable: true }
      responses:
        '200':
          description: 갱신된 내 정보
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [auth]
      operationId: API-110
      summary: 회원 탈퇴
      description: |
        F-01-09. 요청 즉시 status=WITHDRAWN으로 바꾸고 모든 refresh token을 폐기합니다. 로그인 수단·이메일 인증 세션·Push 등록을 삭제하고 하우징을 비공개로 전환합니다.
        reason은 선택 항목이며 최대 255자까지 보관합니다. email·nickname과 나머지 데이터는 deletionAfter(탈퇴 시각+90일) 이후 배치 삭제 대상입니다.
        기존 access token은 다음 요청부터 거절합니다.
      security:
        - member: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        '204': { description: 탈퇴 완료 }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/MemberOnly' }

  # ---------------------------------------------------------------- API-3xx 알림
  /push/devices:
    put:
      tags: [push]
      operationId: API-301
      summary: Push 디바이스 토큰 등록/갱신
      description: |
        F-03-01. 현재 access token의 sid에 연결된 refresh 세션과 deviceUuid가 일치해야 합니다.
        `(deviceUuid)` 기준 upsert이며 다른 계정으로 로그인한 뒤 같은 기기에서 등록하면 소유자를 현재 계정으로 이전합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceUuid, platform, pushToken]
              properties:
                deviceUuid: { type: string, format: uuid }
                platform: { $ref: '#/components/schemas/Platform' }
                pushToken: { type: string, minLength: 1, maxLength: 8192 }
      responses:
        '204': { description: 등록됨 }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /push/devices/{deviceUuid}:
    delete:
      tags: [push]
      operationId: API-302
      summary: Push 디바이스 토큰 삭제
      description: 소유한 기기의 Push 토큰을 삭제합니다. 다른 계정 소유이거나 이미 없는 기기면 변경 없이 204를 반환합니다.
      parameters:
        - name: deviceUuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 삭제됨 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- API-4xx 학습
  /courses:
    get:
      tags: [learning]
      operationId: API-401
      summary: 코스 목록 (분야별)
      description: F-04-02. ONBOARDING 코스는 제외.
      parameters:
        - name: category
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 코스 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      courses:
                        type: array
                        items: { $ref: '#/components/schemas/CourseSummary' }

  /courses/{courseId}:
    get:
      tags: [learning]
      operationId: API-402
      summary: 코스 상세 (레슨 목록 · 일일 해금 판정)
      description: |
        F-04-03, F-04-08. 호출 시 그 코스에 오늘(KST) 해금된 레슨이 없고 다음 미해금 레슨이 있으면
        레슨 하나를 UNLOCKED로 만듭니다(접속한 날마다 코스당 1개).
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: 코스 상세
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CourseDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /lessons/{lessonId}:
    get:
      tags: [learning]
      operationId: API-403
      summary: 레슨 상세 (컨텐츠 목록)
      description: F-04-01. 퀴즈 컨텐츠는 정답·해설을 제외합니다.
      parameters:
        - $ref: '#/components/parameters/LessonId'
      responses:
        '200':
          description: 레슨 상세
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LessonDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /lessons/{lessonId}/start:
    post:
      tags: [learning]
      operationId: API-404
      summary: 레슨 시작 / 이어하기 / 다시 하기
      description: |
        F-04-04, F-04-07, F-04-10, F-05-05.
        1) 해금 검사(미해금 ERR-20, `unlocksAt` 포함) → 2) 복습 세트가 만들어지면 `reviewRequired=true`로
        먼저 돌려주고 레슨 진입은 복습 완료 후 → 3) UNLOCKED이면 IN_PROGRESS로.
        오늘 복습 완료 세션이 있거나 후보가 5개 미만이면 복습 없이 진입합니다.
        `replay=true`는 COMPLETED 레슨을 다시 풉니다. 다시 풀기 진행은 별도 저장하며 보상은 지급하지 않습니다.
      parameters:
        - $ref: '#/components/parameters/LessonId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                replay: { type: boolean, default: false }
      responses:
        '200':
          description: 레슨 시작 결과. 복습 필수 시 reviewRequired=true와 복습 세트를 반환하고 콘텐츠는 비웁니다.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LessonStartResponse' }
        '403':
          description: ERR-20 LESSON_LOCKED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /contents/{contentId}/complete:
    post:
      tags: [learning]
      operationId: API-405
      summary: 컨텐츠 완료 보고 (이어하기 위치 갱신)
      description: |
        F-04-05, F-04-09. 일반 학습은 마지막 컨텐츠에서 레슨 완료 처리와 보상 지급까지 같은 트랜잭션으로 수행하고
        `lessonCompleted=true`와 보상 본문을 함께 돌려줍니다. 다시 풀기는 별도 진척을 저장하고 마지막 콘텐츠까지 완료한 뒤 학습일을 갱신하며 보상은 주지 않습니다.
        복습 미완료 상태면 ERR-21입니다.
      parameters:
        - name: contentId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 진행 상태
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      progress: { $ref: '#/components/schemas/LessonProgress' }
                      lessonCompleted: { type: boolean }
                      completion:
                        allOf:
                          - $ref: '#/components/schemas/LessonCompleteResponse'
                        nullable: true
        '409':
          description: ERR-21 REVIEW_REQUIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /quizzes/{quizId}/answer:
    post:
      tags: [learning]
      operationId: API-406
      summary: 퀴즈 답안 제출·채점
      description: |
        F-04-06, F-05-02, F-06-03, F-03-04. 기존 8종 계약으로 채점하고 결과·해설과 답안을 기록합니다.
        정답 객체는 반환하지 않습니다. FLIP_CARD 미완료 상태의 해설은 빈 문자열입니다.
        해금된 레슨의 퀴즈만 제출할 수 있습니다. 오늘 복습을 요구받은 경우 복습을 완료해야 답안을 제출할 수 있습니다.
        완료된 레슨은 `replay=true`로 다시 풀 수 있으며, replay 시작 후 현재 콘텐츠 순서에 맞는 퀴즈만 답할 수 있습니다.
        일반 레슨 답안은 완료 시 복습 풀(WRONG/CORRECT)을 갱신합니다. CORRECT 항목은 다음 KST 자정부터 복습 후보가 됩니다.
        학습일·연속일은 퀴즈 제출이 아닌 레슨·복습·replay 전체 완료 시 갱신합니다. FLIP_CARD 부분 제출은 완료로 보지 않습니다.
        replay 답안은 이력만 저장하며 복습 풀과 레슨 보상을 바꾸지 않습니다.
      parameters:
        - name: quizId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response: { $ref: '#/components/schemas/QuizUserResponse' }
                replay: { type: boolean, default: false }
      responses:
        '200':
          description: 채점 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AnswerResult' }
        '409':
          description: 복습 미완료 또는 현재 콘텐츠 순서와 맞지 않는 답안
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/LessonLocked' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 저장된 퀴즈 데이터 오류 또는 replay 상태 충돌
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /lessons/{lessonId}/complete:
    post:
      tags: [learning]
      operationId: API-407
      summary: 레슨 완료 (보상 지급)
      description: |
        F-04-09, F-04-11, F-11-01, F-11-03, F-13-02/03. 최초 완료 1회만 보상.
        API-405가 마지막 콘텐츠를 완료하면 이 처리를 자동 실행합니다. 이 API는 호환용 완료 요청이며 이미 완료된 레슨에 추가 보상을 주지 않습니다.
        코스의 모든 레슨이 완료되면 별자리 배지를 지급합니다.
      parameters:
        - $ref: '#/components/parameters/LessonId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 지급된 보상
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LessonCompleteResponse' }
        '409':
          description: ERR-07 (마지막 컨텐츠 미완료) / ERR-21 / 같은 멱등 키에 다른 요청 본문
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/me/progress:
    get:
      tags: [learning]
      operationId: API-408
      summary: 전체 진행 상황
      description: F-04-08.
      responses:
        '200':
          description: 진행 상황
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      courses:
                        type: array
                        items:
                          type: object
                          properties:
                            courseId: { type: integer, format: int64 }
                            completedLessons: { type: integer }
                            totalLessons: { type: integer }
                      current:
                        type: object
                        nullable: true
                        properties:
                          lessonId: { type: integer, format: int64 }
                          courseId: { type: integer, format: int64 }
                          status: { $ref: '#/components/schemas/LessonStatus' }

  # ---------------------------------------------------------------- API-5xx 복습
  /reviews/next:
    get:
      tags: [review]
      operationId: API-501
      summary: 복습 세트 조회 (5문항, 틀린 문제 80% · 맞춘 문제 20%)
      description: |
        F-05-01. 후보가 5개 미만이면 `reviewItems=[]`와 `message`("더 이상 복습할 문제가 없어요")를 돌려줍니다.
        복습에서 오늘 맞춘 문제는 제외됩니다.
      parameters:
        - name: lessonId
          in: query
          required: false
          description: 레슨 시작 전 복습이면 지정, 단독 복습은 생략
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 복습 세트
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ReviewSet' }

  /reviews/{reviewItemId}/answer:
    post:
      tags: [review]
      operationId: API-502
      summary: 복습 답안 제출
      description: |
        F-05-03, F-05-06. 정답이면 다음 날 00:00 KST까지 재출제 제외(`excludedUntil`),
        오답이면 WRONG 풀로 이동하고 바로 재출제 가능.
        기존 8종 response로 채점합니다. FLIP_CARD의 부분 제출은 세트 항목 완료·당일 제외로 처리하지 않습니다.
      parameters:
        - name: reviewItemId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response: { $ref: '#/components/schemas/QuizUserResponse' }
      responses:
        '200':
          description: 채점 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/AnswerResult'
                      - type: object
                        properties:
                          excludedUntil:
                            type: string
                            format: date-time
                            nullable: true
        '404': { $ref: '#/components/responses/NotFound' }

        '409': { $ref: '#/components/responses/QuizDataInvalid' }

  /reviews/complete:
    post:
      tags: [review]
      operationId: API-503
      summary: 복습 세션 완료 (보상)
      description: F-05-04, F-11-02. 5문항이 오늘 모두 제출됐는지 확인합니다. 완료 시 학습일·연속일을 갱신하고 하루 최대 3세션까지 보상합니다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewItemIds]
              properties:
                reviewItemIds:
                  type: array
                  minItems: 5
                  maxItems: 5
                  items: { type: integer, format: int64 }
      responses:
        '200':
          description: 보상 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/RewardResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '409':
          description: 같은 멱등 키에 다른 요청 본문
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ---------------------------------------------------------------- API-6xx 온보딩
  /onboarding:
    get:
      tags: [onboarding]
      operationId: API-601
      summary: 온보딩 퀴즈 조회
      description: F-06-03. 미완료 사용자에게 유일한 ONBOARDING 레슨과 정답·해설을 제외한 퀴즈 콘텐츠를 반환한다. 완료 또는 건너뛴 계정은 다시 조회할 수 없다.
      responses:
        '200':
          description: 온보딩 레슨
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lesson: { $ref: '#/components/schemas/LessonDetail' }
        '409':
          description: 온보딩을 이미 완료했거나 건너뜀
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /onboarding/complete:
    post:
      tags: [onboarding]
      operationId: API-602
      summary: 온보딩 완료 또는 건너뛰기
      description: |
        F-06-04, F-06-05, F-11-06. `skipped=false`는 모든 퀴즈를 완료한 뒤 STARDUST 50개를 한 번 지급하고 KST 학습일·연속일을 갱신한다. `skipped=true`는 보상 없이 완료 처리하며 학습일을 갱신하지 않는다.
        두 경우 모두 다시 진행할 수 없다. 사용자·operation·키·본문이 같은 재요청은 저장된 응답을 반환한다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skipped]
              properties:
                skipped: { type: boolean }
      responses:
        '200':
          description: 보상과 완료 상태
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/RewardResponse'
                      - type: object
                        properties:
                          onboardingCompleted: { type: boolean }
        '409':
          description: 일반 완료 요건 미충족 또는 같은 멱등 키에 다른 요청 본문
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ---------------------------------------------------------------- API-7xx 하우징·아바타
  /housings/me:
    get:
      tags: [housing]
      operationId: API-701
      summary: 내 우주 조회 (홈)
      description: F-07-02, F-08-02, F-09-05.
      responses:
        '200':
          description: 내 하우징
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/HousingDetail' }
    patch:
      tags: [housing]
      operationId: API-703
      summary: 하우징 이름 · 공개 여부 변경
      description: F-07-07, F-09-02. `isPublic`은 회원만(게스트 ERR-41).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 20 }
                isPublic: { type: boolean, description: 회원만 변경할 수 있습니다. }
      responses:
        '200':
          description: 하우징
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Housing' }
        '403': { $ref: '#/components/responses/MemberOnly' }

  /housings/me/placements:
    put:
      tags: [housing]
      operationId: API-702
      summary: 배치 전체 저장 (꾸미기 모드 '저장하기')
      description: |
        F-07-04, F-07-05, F-14-04. 배치 전체를 교체합니다(최대 200개, 빈 배열 = 모두 제거).
        미보유 inventoryId ERR-30, 영역 불일치 ERR-31.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [placements]
              properties:
                placements:
                  type: array
                  maxItems: 200
                  items: { $ref: '#/components/schemas/PlacementInput' }
      responses:
        '200':
          description: 저장된 배치
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      placements:
                        type: array
                        items: { $ref: '#/components/schemas/Placement' }
        '400':
          description: ERR-30 / ERR-31 / ERR-05
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /housings/me/avatar:
    patch:
      tags: [housing]
      operationId: API-704
      summary: 아바타 위치·상태 저장
      description: F-08-03. `placementId`는 본인 배치여야 함(ERR-32).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                x: { type: number, minimum: 0, maximum: 1 }
                y: { type: number, minimum: 0, maximum: 1 }
                state: { $ref: '#/components/schemas/AvatarState' }
                placementId:
                  type: integer
                  format: int64
                  nullable: true
      responses:
        '200':
          description: 아바타
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Avatar' }
        '400':
          description: ERR-32 PLACEMENT_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ---------------------------------------------------------------- API-8xx 커뮤니티
  /housings/explore:
    get:
      tags: [community]
      operationId: API-801
      summary: 공개 하우징 탐색 (우주 탐험)
      description: |
        F-09-01. 호출자 하우징이 비공개면 ERR-40. 본인, 양방향 차단 관계, ACTIVE가 아닌 사용자는 목록에서 제외한다. `recent`는 공개 하우징 프로필 수정 시각과 사용자 ID 내림차순이다. 현재 좋아요 저장소가 없어 `popular`는 `recent`와 같은 순서를 사용한다.
      security:
        - member: []
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [recent, popular]
            default: recent
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 하우징 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      housings:
                        type: array
                        items: { $ref: '#/components/schemas/HousingCard' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '403':
          description: ERR-40 HOUSING_PRIVATE_SELF / ERR-41
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /housings/{housingId}:
    get:
      tags: [community]
      operationId: API-802
      summary: 다른 유저 하우징 구경
      description: F-09-03, F-08-02. 본인·비공개·양방향 차단·ACTIVE가 아닌 대상은 ERR-42(사유 비노출).
      security:
        - member: []
      parameters:
        - $ref: '#/components/parameters/HousingId'
      responses:
        '200':
          description: 하우징 상세
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/HousingDetail'
                      - type: object
                        properties:
                          ownerNickname: { type: string, nullable: true }
                          likedByMe: { type: boolean }
        '403':
          description: ERR-40 / ERR-41
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: ERR-42 HOUSING_NOT_VISIBLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /housings/{housingId}/like:
    post:
      tags: [community]
      operationId: API-803
      summary: 좋아요
      description: F-09-04. 공개·ACTIVE 하우징에 멱등 처리한다. 본인 하우징은 ERR-43, 비공개·차단 대상은 ERR-42다.
      security:
        - member: []
      parameters:
        - $ref: '#/components/parameters/HousingId'
      responses:
        '200':
          description: 좋아요 상태
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LikeState' }
        '400':
          description: ERR-43 SELF_TARGET
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: ERR-42 HOUSING_NOT_VISIBLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [community]
      operationId: API-804
      summary: 좋아요 취소
      description: F-09-04. 공개·ACTIVE 하우징에 멱등 처리한다. 본인 하우징은 ERR-43, 비공개·차단 대상은 ERR-42다.
      security:
        - member: []
      parameters:
        - $ref: '#/components/parameters/HousingId'
      responses:
        '200':
          description: 좋아요 상태
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LikeState' }
        '400':
          description: ERR-43 SELF_TARGET
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: ERR-42 HOUSING_NOT_VISIBLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /reports:
    post:
      tags: [community]
      operationId: API-805
      summary: 신고
      description: |
        F-09-06. ACTIVE 회원만 ACTIVE 하우징을 신고할 수 있습니다. reason은 INAPPROPRIATE_NAME, ABUSE,
        SPAM, OTHER 중 하나이며 detail은 선택 사항으로 최대 255자입니다. 같은 신고자의
        반복 신고는 임계 인원을 늘리지 않습니다. 최근 24시간 내 서로 다른 신고자 3명에 도달하면
        30일간 모든 사용자에게 숨기며, 숨김 중 추가 신고는 종료 시각을 연장하지 않습니다. 대상에게 알리지 않습니다.
      security:
        - member: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [housingId, reason]
              properties:
                housingId: { type: integer, format: int64 }
                reason: { $ref: '#/components/schemas/ReportReason' }
                detail: { type: string, maxLength: 255 }
      responses:
        '200':
          description: 신고 접수
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      reportId: { type: integer, format: int64 }
        '400':
          description: ERR-43 SELF_TARGET / ERR-05
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: 대상 사용자 없음 또는 활성 상태 아님
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /blocks:
    get:
      tags: [community]
      operationId: API-808
      summary: 차단한 사용자 목록
      description: F-09-07, F-15-05. ACTIVE 회원의 차단만 반환한다. 최근 차단 순으로 페이지 조회하며 차단 대상이 탈퇴하면 목록에서 제외한다.
      security:
        - member: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 차단 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      users:
                        type: array
                        items:
                          type: object
                          properties:
                            userId: { type: integer, format: int64 }
                            nickname: { type: string, nullable: true }
                            blockedAt: { type: string, format: date-time }
                  meta: { $ref: '#/components/schemas/PageMeta' }

  /blocks/{userId}:
    post:
      tags: [community]
      operationId: API-806
      summary: 사용자 차단
      description: F-09-07. ACTIVE 회원을 차단한다. 차단 방향과 무관하게 탐색·상세 조회에서 서로 제외한다. 이미 차단한 대상의 재요청은 성공 처리한다. 본인 ERR-43.
      security:
        - member: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204': { description: 차단됨 }
        '400':
          description: ERR-43 SELF_TARGET
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [community]
      operationId: API-807
      summary: 차단 풀기
      description: F-09-07. 이미 해제된 관계를 다시 해제해도 성공 처리한다.
      security:
        - member: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204': { description: 해제됨 }

  # ---------------------------------------------------------------- API-9xx 상점·보상·재화·별자리·인벤토리
  /shop/items:
    get:
      tags: [shop]
      operationId: API-901
      summary: 상점 목록
      description: F-10-01. 해금 여부, 옵션별 보유 여부, 최저 가격 포함.
      parameters:
        - name: itemType
          in: query
          schema: { $ref: '#/components/schemas/ItemType' }
      responses:
        '200':
          description: 아이템 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ShopItem' }

  /shop/items/{itemId}:
    get:
      tags: [shop]
      operationId: API-902
      summary: 아이템 상세 (옵션·가격·미리보기 에셋)
      description: F-10-02.
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 아이템 상세
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      item: { $ref: '#/components/schemas/ShopItem' }
                      options:
                        type: array
                        items: { $ref: '#/components/schemas/ShopOption' }
        '404': { $ref: '#/components/responses/NotFound' }

  /shop/purchases:
    post:
      tags: [shop]
      operationId: API-903
      summary: 구매 (여러 옵션 일괄, 전부 성공 또는 전부 실패)
      description: |
        F-10-04, F-15-04. 상점 모드의 '모두 구매 후 저장(미보유 아이템만)'이 호출합니다.
        항목별 검증 순서: 해금(ERR-50) → 옵션 유효·판매 중(ERR-52) → 동일 옵션 미보유(ERR-53) → 통화별 합계 잔액(ERR-51).
        하나라도 실패하면 전체 거부하고 `error.items[]`에 항목별 사유를 돌려줍니다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [itemId, optionId]
                    properties:
                      itemId: { type: integer }
                      optionId: { type: integer, format: int64 }
      responses:
        '200':
          description: 구매 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      inventoryItems:
                        type: array
                        items: { $ref: '#/components/schemas/InventoryItem' }
                      wallet: { $ref: '#/components/schemas/Wallet' }
        '400':
          description: ERR-52 OPTION_INVALID / ERR-05
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseErrorResponse' }
        '402':
          description: ERR-51 INSUFFICIENT_BALANCE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseErrorResponse' }
        '403':
          description: ERR-50 ITEM_LOCKED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseErrorResponse' }
        '409':
          description: ERR-53 ALREADY_OWNED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseErrorResponse' }

  /users/me/wallet:
    get:
      tags: [shop]
      operationId: API-904
      summary: 재화 잔액
      description: F-12-02.
      responses:
        '200':
          description: 잔액
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Wallet' }

  /users/me/rewards:
    get:
      tags: [shop]
      operationId: API-905
      summary: 보상 지급 내역
      description: F-11-05. 지급 시각 내림차순으로 조회한다. cursor는 응답에서 받은 불투명 커서이며 size 기본값은 20, 최대 100이다.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 보상 내역
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      rewards:
                        type: array
                        items: { $ref: '#/components/schemas/RewardRecord' }
                  meta: { $ref: '#/components/schemas/PageMeta' }

  /constellations:
    get:
      tags: [shop]
      operationId: API-906
      summary: 별자리 목록과 획득 현황
      description: F-13-04. 코스에 연결된 별자리와 사용자별 레슨 STAR 획득 수 및 코스 배지 획득 여부를 반환한다.
      responses:
        '200':
          description: 별자리
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      constellations:
                        type: array
                        items: { $ref: '#/components/schemas/Constellation' }

  /users/me/inventory:
    get:
      tags: [shop]
      operationId: API-907
      summary: 인벤토리 조회
      description: F-14-01. 기존 하우징 보유 자산을 조회한다. FURNITURE는 가구만, OBJECT는 가구 이외 자산을 반환한다.
      parameters:
        - name: itemType
          in: query
          schema: { $ref: '#/components/schemas/ItemType' }
      responses:
        '200':
          description: 보유 아이템
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/InventoryItem' }

components:
  securitySchemes:
    guest:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 게스트 이상 (role=GUEST | MEMBER)
    member:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 회원만 (role=MEMBER). 게스트는 ERR-41 MEMBER_ONLY

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 24시간 내 같은 사용자·operation·키와 같은 요청 본문은 저장한 응답을 반환합니다. 본문이 다르면 409이며 실패 응답은 저장하지 않아 재시도할 수 있습니다.
      schema: { type: string, minLength: 1, maxLength: 64 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    CourseId:
      name: courseId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    LessonId:
      name: lessonId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    HousingId:
      name: housingId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    OAuthProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [google, kakao, apple]
    LinkProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [email, google, kakao, apple]

  responses:
    Unauthorized:
      description: ERR-01 UNAUTHORIZED / ERR-03 AUTH_TOKEN_EXPIRED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    MemberOnly:
      description: ERR-41 MEMBER_ONLY
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: ERR-06 NOT_FOUND
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationFailed:
      description: ERR-05 VALIDATION_FAILED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    LessonLocked:
      description: ERR-20 LESSON_LOCKED. 다음 해금 가능 시각은 unlocksAt에 반환한다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: ERR-08 RATE_LIMITED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

    QuizDataInvalid:
      description: QUIZ_DATA_INVALID. 저장된 config·answer가 잘못되었다. 정답 데이터는 포함하지 않는다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # ---- 공통
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: L3 ERR 표의 코드명
              enum:
                - UNAUTHORIZED
                - FORBIDDEN
                - AUTH_TOKEN_EXPIRED
                - AUTH_TOKEN_REUSED
                - VALIDATION_FAILED
                - NOT_FOUND
                - CONFLICT
                - RATE_LIMITED
                - INTERNAL
                - EMAIL_ALREADY_REGISTERED
                - PROVIDER_ALREADY_LINKED
                - ACCOUNT_LOCKED
                - LAST_AUTH_METHOD
                - ACCOUNT_EXISTS_FOR_PROVIDER
                - VERIFICATION_INVALID
                - QUIZ_DATA_INVALID
                - LESSON_LOCKED
                - REVIEW_REQUIRED
                - INVENTORY_ITEM_NOT_OWNED
                - PLACEMENT_AREA_MISMATCH
                - PLACEMENT_NOT_FOUND
                - HOUSING_PRIVATE_SELF
                - MEMBER_ONLY
                - HOUSING_NOT_VISIBLE
                - SELF_TARGET
                - ITEM_LOCKED
                - INSUFFICIENT_BALANCE
                - OPTION_INVALID
                - ALREADY_OWNED
            message: { type: string }
            fields:
              type: array
              description: VALIDATION_FAILED일 때 필드별 사유
              items:
                type: object
                properties:
                  field: { type: string }
                  reason: { type: string }
            retryAfter:
              type: integer
              description: ACCOUNT_LOCKED · RATE_LIMITED 시 초 단위
            unlocksAt:
              type: string
              format: date-time
              nullable: true
              description: LESSON_LOCKED 시 다음 해금 시각
    PurchaseErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      itemId: { type: integer }
                      optionId: { type: integer, format: int64 }
                      code: { type: string }
    PageMeta:
      type: object
      properties:
        nextCursor:
          type: string
          nullable: true

    # ---- 열거형 (L3 ENUM)
    AuthProvider:
      type: string
      description: ENUM-01
      enum: [EMAIL, GOOGLE, KAKAO, APPLE, GUEST]
    UserStatus:
      type: string
      description: ENUM-02
      enum: [GUEST, ACTIVE, WITHDRAWN]
    Platform:
      type: string
      description: ENUM-03
      enum: [IOS, ANDROID]
    ContentType:
      type: string
      description: ENUM-04
      enum: [TEXT, IMAGE, VIDEO, QUIZ]
    QuizType:
      type: string
      description: 기존 8종 interactionType. docs/QUIZ_API.md 기준.
      enum: [SLIDER, SWIPE, TAP, DRAG_DROP, SORT, MATCHING, FLIP_CARD, MULTIPLE_CHOICE]
    LessonStatus:
      type: string
      description: ENUM-06. LOCKED는 진행 행이 없는 레슨(응답 전용)
      enum: [LOCKED, UNLOCKED, IN_PROGRESS, COMPLETED]
    ItemType:
      type: string
      description: ENUM-07
      enum: [FURNITURE, OBJECT]
    HousingItemType:
      type: string
      description: ENUM-08
      enum: [INTERIOR, EXTERIOR]
    AvatarState:
      type: string
      description: ENUM-09 (DB는 0/1/2)
      enum: [IDLE, SIT, SLEEP]
    ReportReason:
      type: string
      description: ENUM-10
      enum: [INAPPROPRIATE_NAME, ABUSE, SPAM, OTHER]
    CurrencyType:
      type: string
      description: ENUM-11
      enum: [STAR, STARDUST]
    RewardType:
      type: string
      description: ENUM-12
      enum: [WALLET, UNLOCK, INVENTORY, CONSTELLATION]
    AcquiredVia:
      type: string
      description: ENUM-13
      enum: [PURCHASE, REWARD, STARTER]
    BadgeType:
      type: string
      description: ENUM-15
      enum: [STAR, CONSTELLATION]

    # ---- 인증·회원
    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn:
          type: integer
          description: access 토큰 수명(초). JWT_ACCESS_TTL 설정값.
    UserBrief:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        nickname: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/UserStatus' }
    AuthResponse:
      type: object
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/TokenPair'
            - type: object
              properties:
                user: { $ref: '#/components/schemas/UserBrief' }
                isNew:
                  type: boolean
                  description: 이 호출로 계정이 새로 만들어졌는지
    Wallet:
      type: object
      required: [star, stardust]
      properties:
        star: { type: integer, format: int64, minimum: 0 }
        stardust: { type: integer, format: int64, minimum: 0 }
    Me:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        nickname: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/UserStatus' }
        providers:
          type: array
          items: { $ref: '#/components/schemas/AuthProvider' }
        wallet: { $ref: '#/components/schemas/Wallet' }
        progress:
          type: object
          properties:
            completedLessons: { type: integer }
            totalLessons: { type: integer }
        housing:
          type: object
          properties:
            isPublic: { type: boolean }
            likeCount: { type: integer }
        onboardingCompleted: { type: boolean }
        pushEnabled: { type: boolean }
        streakDays: { type: integer }
        lastStudyDate:
          type: string
          format: date
          nullable: true

    # ---- 학습
    CourseSummary:
      type: object
      properties:
        courseId: { type: integer, format: int64 }
        title: { type: string }
        category: { type: string }
        totalLessons: { type: integer }
        completedLessons: { type: integer }
        constellation:
          type: object
          nullable: true
          properties:
            constellationId: { type: integer, format: int64 }
            name: { type: string }
    LessonSummary:
      type: object
      properties:
        lessonId: { type: integer, format: int64 }
        title: { type: string }
        order: { type: integer }
        status: { $ref: '#/components/schemas/LessonStatus' }
        unlocksAt:
          type: string
          format: date-time
          nullable: true
          description: LOCKED 레슨의 다음 해금 가능 시각(오늘 해금분이 남아 있으면 null)
        completedAt:
          type: string
          format: date-time
          nullable: true
    CourseDetail:
      allOf:
        - $ref: '#/components/schemas/CourseSummary'
        - type: object
          properties:
            description: { type: string }
            lessons:
              type: array
              items: { $ref: '#/components/schemas/LessonSummary' }
    QuizPublic:
      type: object
      description: 기존 공개 퀴즈 계약. config는 interactionType에 대응한다. 정답·해설은 제외한다.
      required: [quizId, lessonId, question, instruction, interactionType, config, difficulty, quizOrder]
      additionalProperties: false
      properties:
        quizId: { type: integer, format: int64, minimum: 1 }
        lessonId: { type: integer, format: int64, minimum: 1 }
        question: { type: string }
        instruction: { type: string }
        interactionType: { $ref: '#/components/schemas/QuizType' }
        config: { $ref: '#/components/schemas/QuizConfig' }
        difficulty: { type: string, minLength: 1, maxLength: 30 }
        quizOrder: { type: integer, minimum: 0 }
      oneOf:
        - properties:
            interactionType: { const: SLIDER }
            config: { $ref: '#/components/schemas/SliderConfig' }
        - properties:
            interactionType: { const: SWIPE }
            config: { $ref: '#/components/schemas/SwipeConfig' }
        - properties:
            interactionType: { const: TAP }
            config: { $ref: '#/components/schemas/TapConfig' }
        - properties:
            interactionType: { const: DRAG_DROP }
            config: { $ref: '#/components/schemas/DragDropConfig' }
        - properties:
            interactionType: { const: SORT }
            config: { $ref: '#/components/schemas/SortConfig' }
        - properties:
            interactionType: { const: MATCHING }
            config: { $ref: '#/components/schemas/MatchingConfig' }
        - properties:
            interactionType: { const: FLIP_CARD }
            config: { $ref: '#/components/schemas/FlipCardConfig' }
        - properties:
            interactionType: { const: MULTIPLE_CHOICE }
            config: { $ref: '#/components/schemas/MultipleChoiceConfig' }
    Content:
      type: object
      properties:
        contentId: { type: integer, format: int64 }
        order: { type: integer }
        contentType: { $ref: '#/components/schemas/ContentType' }
        body:
          type: string
          nullable: true
        mediaUrl:
          type: string
          format: uri
          nullable: true
        quiz:
          allOf:
            - $ref: '#/components/schemas/QuizPublic'
          nullable: true
    LessonDetail:
      type: object
      properties:
        lessonId: { type: integer, format: int64 }
        courseId: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string }
        contents:
          type: array
          items: { $ref: '#/components/schemas/Content' }
    LessonProgress:
      type: object
      properties:
        status: { $ref: '#/components/schemas/LessonStatus' }
        lastContentId:
          type: integer
          format: int64
          nullable: true
        resumeContentId:
          type: integer
          format: int64
          nullable: true
    LessonStartResponse:
      type: object
      properties:
        reviewRequired: { type: boolean }
        review:
          allOf:
            - $ref: '#/components/schemas/ReviewSet'
          nullable: true
        progress: { $ref: '#/components/schemas/LessonProgress' }
        contents:
          type: array
          items: { $ref: '#/components/schemas/Content' }
    QuizNonBlank:
      type: string
      minLength: 1
      pattern: '\S'
    QuizItemOption:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/QuizNonBlank' }
        text: { $ref: '#/components/schemas/QuizNonBlank' }
        imageUrl: { $ref: '#/components/schemas/QuizNonBlank' }
      anyOf:
        - required: [text]
        - required: [imageUrl]
    QuizItems:
      type: array
      minItems: 1
      description: 항목 ID는 배열 안에서 유일해야 한다.
      items: { $ref: '#/components/schemas/QuizItemOption' }
    QuizCommonConfig:
      type: object
      description: 선택 필드는 생략 가능하지만 null은 허용하지 않는다. 지정한 값은 그대로 반환한다.
      properties:
        shuffle: { type: boolean }
        allowRetry: { type: boolean, enum: [true] }
        showHint: { type: boolean, enum: [false] }
    SliderConfig:
      type: object
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/QuizCommonConfig'
      required: [min, max, step]
      properties:
        min: { type: number }
        max: { type: number }
        step: { type: number, exclusiveMinimum: 0 }
        initialValue: { type: number }
        unit: { type: string }
        showValue: { type: boolean }
      description: min < max이며 값은 min에서 step 간격이다. 단위는 빈 문자열도 허용한다.
    SwipeChoice:
      type: object
      additionalProperties: false
      required: [value, label]
      properties:
        value: { $ref: '#/components/schemas/QuizNonBlank' }
        label: { $ref: '#/components/schemas/QuizNonBlank' }
    SwipeConfig:
      type: object
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/QuizCommonConfig'
      required: [left, right]
      properties:
        left: { $ref: '#/components/schemas/SwipeChoice' }
        right: { $ref: '#/components/schemas/SwipeChoice' }
    QuizSelectionConfig:
      type: object
      required: [selectionType]
      properties:
        selectionType: { type: string, enum: [SINGLE, MULTIPLE] }
        maxSelections: { type: integer, minimum: 1, maximum: 2147483647 }
      description: SINGLE은 한 개, MULTIPLE은 하나 이상 선택한다. SINGLE의 maxSelections는 1만 허용한다.
      allOf:
        - if:
            properties:
              selectionType: { const: SINGLE }
          then:
            properties:
              maxSelections: { const: 1 }
    TapConfig:
      type: object
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/QuizCommonConfig'
        - $ref: '#/components/schemas/QuizSelectionConfig'
      required: [items]
      properties:
        items: { $ref: '#/components/schemas/QuizItems' }
    MultipleChoiceConfig:
      type: object
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/QuizCommonConfig'
        - $ref: '#/components/schemas/QuizSelectionConfig'
      required: [options]
      properties:
        options: { $ref: '#/components/schemas/QuizItems' }
    DragDropConfig:
      type: object
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/QuizCommonConfig'
      required: [items, targets]
      properties:
        items: { $ref: '#/components/schemas/QuizItems' }
        targets: { $ref: '#/components/schemas/QuizItems' }
    SortConfig:
      type: object
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/QuizCommonConfig'
      required: [items]
      properties:
        items: { $ref: '#/components/schemas/QuizItems' }
    MatchingConfig:
      type: object
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/QuizCommonConfig'
      required: [leftItems, rightItems]
      properties:
        leftItems: { $ref: '#/components/schemas/QuizItems' }
        rightItems: { $ref: '#/components/schemas/QuizItems' }
    FlipCardConfig:
      type: object
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/QuizCommonConfig'
      required: [cards]
      properties:
        cards:
          allOf:
            - $ref: '#/components/schemas/QuizItems'
          minItems: 2
      description: cards는 짝수 개다. 정답 짝은 config에 포함하지 않는다.
    QuizConfig:
      description: interactionType에 대응하는 config. 선택 필드와 엄격한 검증은 docs/QUIZ_API.md를 따른다.
      anyOf:
        - $ref: '#/components/schemas/SliderConfig'
        - $ref: '#/components/schemas/SwipeConfig'
        - $ref: '#/components/schemas/TapConfig'
        - $ref: '#/components/schemas/DragDropConfig'
        - $ref: '#/components/schemas/SortConfig'
        - $ref: '#/components/schemas/MatchingConfig'
        - $ref: '#/components/schemas/FlipCardConfig'
        - $ref: '#/components/schemas/MultipleChoiceConfig'
    QuizIds:
      type: array
      minItems: 1
      uniqueItems: true
      items: { $ref: '#/components/schemas/QuizNonBlank' }
    QuizIdMap:
      type: object
      minProperties: 1
      propertyNames: { $ref: '#/components/schemas/QuizNonBlank' }
      additionalProperties: { $ref: '#/components/schemas/QuizNonBlank' }
    SliderUserResponse:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: { type: number }
    SwipeUserResponse:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: { $ref: '#/components/schemas/QuizNonBlank' }
    TapUserResponse:
      type: object
      additionalProperties: false
      required: [selectedItemIds]
      properties:
        selectedItemIds: { $ref: '#/components/schemas/QuizIds' }
    MultipleChoiceUserResponse:
      type: object
      additionalProperties: false
      required: [selectedOptionIds]
      properties:
        selectedOptionIds: { $ref: '#/components/schemas/QuizIds' }
    DragDropUserResponse:
      type: object
      additionalProperties: false
      required: [placements]
      properties:
        placements: { $ref: '#/components/schemas/QuizIdMap' }
    SortUserResponse:
      type: object
      additionalProperties: false
      required: [order]
      properties:
        order: { $ref: '#/components/schemas/QuizIds' }
    MatchingUserResponse:
      type: object
      additionalProperties: false
      required: [matches]
      properties:
        matches: { $ref: '#/components/schemas/QuizIdMap' }
    QuizCardPair:
      type: object
      additionalProperties: false
      required: [firstCardId, secondCardId]
      properties:
        firstCardId: { $ref: '#/components/schemas/QuizNonBlank' }
        secondCardId: { $ref: '#/components/schemas/QuizNonBlank' }
    FlipCardUserResponse:
      type: object
      additionalProperties: false
      required: [pairs]
      properties:
        pairs:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/QuizCardPair' }
      description: 카드는 한 번만 사용한다. 짝 안의 순서와 짝 배열의 순서는 무관하다.
    QuizUserResponse:
      description: |
        URL의 문제로 유형을 결정한다. interactionType은 제출하지 않는다.
        docs/QUIZ_API.md의 타입·ID·선택 수·범위 검증을 적용한다.
        숫자 문자열·Boolean 자동 변환과 내부 추가 필드를 허용하지 않는다.
      oneOf:
        - $ref: '#/components/schemas/SliderUserResponse'
        - $ref: '#/components/schemas/SwipeUserResponse'
        - $ref: '#/components/schemas/TapUserResponse'
        - $ref: '#/components/schemas/DragDropUserResponse'
        - $ref: '#/components/schemas/SortUserResponse'
        - $ref: '#/components/schemas/MatchingUserResponse'
        - $ref: '#/components/schemas/FlipCardUserResponse'
        - $ref: '#/components/schemas/MultipleChoiceUserResponse'
    AnswerResult:
      type: object
      required: [attemptId, graded, correct, completed, explanation, streakDays]
      properties:
        attemptId: { type: integer, format: int64 }
        graded: { type: boolean }
        correct: { type: [boolean, 'null'] }
        completed:
          type: boolean
          description: 유효한 답안은 true. FLIP_CARD는 모든 짝이 맞아야 true다.
        explanation:
          type: string
          description: FLIP_CARD 미완료는 빈 문자열. 정답 객체는 포함하지 않는다.
        streakDays: { type: integer }
    Reward:
      type: object
      properties:
        type: { $ref: '#/components/schemas/RewardType' }
        currency:
          allOf:
            - $ref: '#/components/schemas/CurrencyType'
          nullable: true
        amount:
          type: integer
          format: int64
          nullable: true
        itemId:
          type: integer
          nullable: true
        badge:
          type: object
          nullable: true
          properties:
            badgeType: { $ref: '#/components/schemas/BadgeType' }
            constellationId: { type: integer, format: int64 }
            lessonId:
              type: integer
              format: int64
              nullable: true
    RewardResponse:
      type: object
      properties:
        rewards:
          type: array
          items: { $ref: '#/components/schemas/Reward' }
        wallet: { $ref: '#/components/schemas/Wallet' }
    LessonCompleteResponse:
      allOf:
        - $ref: '#/components/schemas/RewardResponse'
        - type: object
          properties:
            courseCompleted: { type: boolean }
    RewardRecord:
      allOf:
        - $ref: '#/components/schemas/Reward'
        - type: object
          properties:
            source:
              type: object
              properties:
                courseId: { type: integer, format: int64 }
                lessonId: { type: integer, format: int64 }
                courseTitle: { type: string }
                lessonTitle: { type: string }
            grantedAt: { type: string, format: date-time }

    # ---- 복습
    ReviewItem:
      type: object
      properties:
        reviewItemId: { type: integer, format: int64 }
        quiz: { $ref: '#/components/schemas/QuizPublic' }
    ReviewSet:
      type: object
      properties:
        reviewItems:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/ReviewItem' }
        message:
          type: string
          nullable: true
          description: 문제가 부족할 때 "더 이상 복습할 문제가 없어요"
        rewardEligible:
          type: boolean
          description: 오늘 보상 세션(3회) 남아 있는지

    # ---- 하우징·아바타
    Transform:
      type: object
      required: [x, y]
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        rotation:
          type: integer
          enum: [0, 90, 180, 270]
          default: 0
        layer:
          type: integer
          minimum: 0
          maximum: 9
          default: 0
    PlacementInput:
      type: object
      required: [inventoryId, area, transform]
      properties:
        inventoryId: { type: string }
        area: { $ref: '#/components/schemas/HousingItemType' }
        transform: { $ref: '#/components/schemas/Transform' }
    Placement:
      allOf:
        - $ref: '#/components/schemas/PlacementInput'
        - type: object
          properties:
            placementId: { type: integer, format: int64 }
            itemId: { type: integer }
            optionId: { type: integer, format: int64 }
            option: { $ref: '#/components/schemas/ItemOption' }
    Avatar:
      type: object
      properties:
        x: { type: number }
        y: { type: number }
        state: { $ref: '#/components/schemas/AvatarState' }
        placementId:
          type: integer
          format: int64
          nullable: true
    Housing:
      type: object
      properties:
        housingId: { type: integer, format: int64 }
        name: { type: string, minLength: 1, maxLength: 20 }
        isPublic: { type: boolean }
        likeCount: { type: integer }
    HousingLayout:
      type: object
      properties:
        backgroundId: { type: string }
        surfaceSkins:
          type: object
          additionalProperties: { type: string }
        avatarId: { type: string }
        placements:
          type: array
          items:
            type: object
            properties:
              slotId: { type: string }
              furnitureId: { type: string }
        updatedAt: { type: string, format: date-time, nullable: true }
    HousingDetail:
      type: object
      properties:
        housing: { $ref: '#/components/schemas/Housing' }
        placements:
          nullable: true
          description: 기존 저장 모델은 좌표형 배치를 지원하지 않아 null입니다. 기존 슬롯 배치는 legacyLayouts에 보존합니다.
          type: array
          items: { $ref: '#/components/schemas/Placement' }
        avatar:
          nullable: true
          description: 기존 저장 모델에는 아바타 배치 상세가 없어 null입니다. 방별 avatarId는 legacyLayouts에 보존합니다.
          allOf:
            - $ref: '#/components/schemas/Avatar'
        activeRoomId: { type: string, nullable: true }
        legacyLayouts:
          type: object
          description: 방별 배경, 표면 스킨, 아바타 ID, 슬롯·가구 배치를 기존 코드 형식으로 보존합니다.
          additionalProperties:
            $ref: '#/components/schemas/HousingLayout'
    HousingCard:
      type: object
      properties:
        housingId: { type: integer, format: int64 }
        ownerNickname: { type: string, nullable: true }
        name: { type: string }
        likeCount: { type: integer }
        likedByMe: { type: boolean }
        preview:
          type: array
          description: 썸네일용 배치 요약(일부)
          items: { $ref: '#/components/schemas/Placement' }
    LikeState:
      type: object
      properties:
        likeCount: { type: integer }
        likedByMe: { type: boolean }

    # ---- 상점·인벤토리·별자리
    ItemOption:
      type: object
      description: option_json
      properties:
        color: { type: string }
        shape: { type: string }
        assetKey: { type: string }
    ShopOption:
      type: object
      properties:
        optionId: { type: integer, format: int64 }
        option: { $ref: '#/components/schemas/ItemOption' }
        currency: { $ref: '#/components/schemas/CurrencyType' }
        price: { type: integer, format: int64 }
        previewAsset: { type: string }
        owned: { type: boolean }
    ShopItem:
      type: object
      properties:
        itemId: { type: integer }
        name: { type: string }
        itemType: { $ref: '#/components/schemas/ItemType' }
        unlocked: { type: boolean }
        unlockHint:
          type: string
          nullable: true
          description: 미해금 시 해금 조건(어느 레슨/코스의 보상인지)
        minPrice:
          type: object
          properties:
            currency: { $ref: '#/components/schemas/CurrencyType' }
            amount: { type: integer, format: int64 }
        options:
          type: array
          items: { $ref: '#/components/schemas/ShopOption' }
    InventoryItem:
      type: object
      properties:
        inventoryId: { type: string }
        itemId: { type: integer, format: int64 }
        optionId: { type: integer, format: int64, nullable: true }
        itemType: { $ref: '#/components/schemas/ItemType' }
        name: { type: string }
        option:
          allOf:
            - $ref: '#/components/schemas/ItemOption'
          nullable: true
        acquiredVia: { $ref: '#/components/schemas/AcquiredVia' }
        acquiredAt: { type: string, format: date-time }
        placed: { type: boolean }
    Constellation:
      type: object
      properties:
        constellationId: { type: integer, format: int64 }
        courseId: { type: integer, format: int64 }
        name: { type: string }
        starCount: { type: integer }
        earnedStars: { type: integer }
        badgeEarned: { type: boolean }
        imageUrl:
          type: string
          format: uri
          nullable: true
